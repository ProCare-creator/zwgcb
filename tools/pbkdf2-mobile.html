<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>自我观察本 · 本机测速</title><style>body{font:18px/1.65 system-ui;max-width:34em;margin:10vh auto;padding:1.3em;background:#faf8f3;color:#283531}button{font:inherit;padding:.5em 1em}</style><h1>账号密码派生测速</h1><p>只用随机测试数据，在本机连续运行三次 PBKDF2-SHA256（600,000 次迭代）。无需输入密码，不会联网。</p><button id="run">开始测速</button><p id="result" role="status"></p><script>run.onclick=async()=>{run.disabled=true;try{if(!crypto.subtle)throw Error('此文件预览器不支持 Web Crypto，请在手机浏览器中打开。');let a=[];for(let i=0;i<3;i++){result.textContent='正在运行第 '+(i+1)+' 次…';let k=await crypto.subtle.importKey('raw',crypto.getRandomValues(new Uint8Array(16)),'PBKDF2',false,['deriveBits']),salt=crypto.getRandomValues(new Uint8Array(16)),t=performance.now();await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',iterations:600000,salt},k,256);a.push(Math.round(performance.now()-t));}result.textContent='三次耗时：'+a.join('、')+' 毫秒；中位数 '+[...a].sort((x,y)=>x-y)[1]+' 毫秒。';}catch(e){result.textContent=e.message;}finally{run.disabled=false;}}</script></html>
