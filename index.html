    --ink-3:#a3b29f;

    --accent-soft:#314435;
    --on-accent:#18271d;

    --pen-soft:#43372e;

.settings-stack .card{padding:var(--s-4);gap:var(--s-3)}
.settings-stack .stage{font-size:var(--fs-h2);margin:0}
.settings-stack .fine,.settings-stack .muted{font-size:var(--fs-small)}
.settings-stack .btn{min-height:44px}
.settings-stack .steps{font-size:var(--fs-small);padding-left:var(--s-5)}
.settings-stack .steps li{margin:var(--s-2) 0}
.settings-stack .theme-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-2)}
.theme-options button{min-height:44px;padding:var(--s-2);border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--card);font-size:var(--fs-small)}
.theme-options button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.summary-transition #summary-body{view-transition-name:reviewday}
.summary-transition #summary-date{view-transition-name:reviewdate}
::view-transition-group(reviewday),::view-transition-group(reviewdate){animation-duration:0s}
.summary-transition::view-transition-old(root),.summary-transition::view-transition-new(root){animation:none}
.summary-transition::view-transition{pointer-events:none}
html[data-dir="prev"]::view-transition-old(reviewday),html[data-dir="prev"]::view-transition-old(reviewdate){animation:day-out-prev 120ms var(--ease-in) both}
html[data-dir="prev"]::view-transition-new(reviewday),html[data-dir="prev"]::view-transition-new(reviewdate){animation:day-in-prev 200ms var(--ease-out) both}
html[data-dir="next"]::view-transition-old(reviewday),html[data-dir="next"]::view-transition-old(reviewdate){animation:day-out-next 120ms var(--ease-in) both}
html[data-dir="next"]::view-transition-new(reviewday),html[data-dir="next"]::view-transition-new(reviewdate){animation:day-in-next 200ms var(--ease-out) both}
::view-transition-old(reviewdate),::view-transition-new(reviewdate){--day-distance:12px}

const trunc = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; };

let S = { days:{}, hyps:{}, weeks:{}, events:{}, archives:{}, meta:{} };
const COLS = ['days','hyps','weeks','events','archives','meta'];
let mode = 'init';           // init | cloud | local
let ready = false, slow = false, migrated = false;
let route = 'review';
let sel = dayKey();          // the day the 预测 / 随手记 / 复盘 pages show
let form = null;             // {type, key, data, dirty}
let ui = { open:new Set(), disclosureSeen:new Set(), skipOpen:false, logOpen:null, hypOpen:null, hypNew:false, copy:null, fresh:null, weekKey:null, arcDel:null, cal:false, calMonth:null, moreMonth:null, moreDay:null, syncEdit:false, syncErr:null, syncOff:false, syncChecking:false };
let drafts = {};
try { drafts = JSON.parse(localStorage.getItem(LS_DRAFT) || '{}') || {}; } catch (e) { drafts = {}; }
let dlNs = null;

/* ---------- storage ---------- */
let base = null;
const queues = {};
function lsWrite(){ try { const o = { savedAt:Date.now() }; COLS.forEach(c => { o[c] = S[c]; }); localStorage.setItem(LS_KEY, JSON.stringify(o)); return true; } catch (e) { return false; } }
function lsRead(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } }
function put(col, id, data){
  data = Object.assign({}, data, { _t:Date.now() });   // change stamp, used when merging with the cloud copy

    return p.catch(e => { toast(errMsg(e)); throw e; });

// Local saves have no snapshot listener to redraw the page, so redraw once after the current step.
let refreshQ = false;
function queueRefresh(){ if (refreshQ) return; refreshQ = true; Promise.resolve().then(() => { refreshQ = false; refresh(); }); }
function remove(col, id){
  S[col] = Object.assign({}, S[col]); delete S[col][id];
  if (mode === 'cloud'){
    const path = col + '/' + id;
    const p = (queues[path] || Promise.resolve()).catch(() => {}).then(() => base.collection(col).doc(id).delete());
    queues[path] = p;
    return p.catch(e => { toast(errMsg(e)); throw e; });
  }
  const del = readDel(); del[col + '/' + id] = Date.now(); writeDel(del);
  lsWrite(); noteLocalChange(); queueRefresh(); return Promise.resolve();
}
function saveDrafts(){ try { localStorage.setItem(LS_DRAFT, JSON.stringify(drafts)); } catch (e) {} }
let draftT = null;
function draftLater(){ clearTimeout(draftT); draftT = setTimeout(saveDrafts, 400); }

/* ---------- cloud sync (offline app only): encrypted file in a private GitHub repo ---------- */
const SYNC_KEY = 'zwgcb-sync', DEL_KEY = 'zwgcb-del', SYNC_PATH = 'zwgcb-data.json';
let syncCfg = null; try { syncCfg = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); } catch (e) {}
let syncBusy = false, syncAgain = false, syncT = null, syncDirty = false, localRev = 0;
let syncState = { ok:null, msg:'', at:null };
function saveSyncCfg(){ try { if (syncCfg) localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); else localStorage.removeItem(SYNC_KEY); } catch (e) {} }
function readDel(){ try { return JSON.parse(localStorage.getItem(DEL_KEY) || '{}') || {}; } catch (e) { return {}; } }
function writeDel(o){ try { localStorage.setItem(DEL_KEY, JSON.stringify(o)); } catch (e) {} }
function noteLocalChange(){ localRev++; syncDirty = true; syncLater(); }
function syncLater(ms){ if (!OFFLINE_APP || !syncCfg || !syncCfg.token) return; clearTimeout(syncT); syncT = setTimeout(() => syncNow(), ms || 4000); }
const b64enc = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const b64dec = str => Uint8Array.from(atob(String(str).replace(/\s/g, '')), c => c.charCodeAt(0));
async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:200000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt', 'decrypt']);

async function encryptJSON(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), key = await deriveKey(pass, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
  return { app:'自我观察本', v:1, kdf:'PBKDF2-SHA256-200000', cipher:'AES-256-GCM', salt:b64enc(salt), iv:b64enc(iv), data:b64enc(ct) };
}
async function decryptJSON(env, pass){
  const key = await deriveKey(pass, b64dec(env.salt));
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64dec(env.iv) }, key, b64dec(env.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
const ghHeaders = extra => Object.assign({ Authorization:'Bearer ' + syncCfg.token, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' }, extra || {});
const ghFileURL = () => 'https://api.github.com/repos/' + syncCfg.repo + '/contents/' + SYNC_PATH;
async function ghGet(){
  const r = await fetch(ghFileURL(), { headers:ghHeaders(), cache:'no-store' });
  if (r.status === 404) return { exists:false };
  if (!r.ok) throw { status:r.status };
  const j = await r.json();
  let text;
  if (j.content && j.encoding === 'base64') text = new TextDecoder().decode(b64dec(j.content));
  else { const r2 = await fetch(ghFileURL(), { headers:ghHeaders({ Accept:'application/vnd.github.raw+json' }), cache:'no-store' }); if (!r2.ok) throw { status:r2.status }; text = await r2.text(); }

}
async function ghPut(text, sha){
  const body = { message:'自我观察本同步 ' + new Date().toISOString(), content:b64enc(new TextEncoder().encode(text)) };
  if (sha) body.sha = sha;
  const r = await fetch(ghFileURL(), { method:'PUT', headers:ghHeaders({ 'Content-Type':'application/json' }), body:JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) return { conflict:true };
  if (!r.ok) throw { status:r.status };
  return { ok:true };
}
function syncErrText(e){
  if (e && e.msg) return e.msg;

  if (st === 404) return '同步失败：找不到这个仓库，或者访问密钥没有它的权限。';
  if (st) return '同步失败：GitHub 返回了错误（' + st + '），稍后会自动再试。';

function snapshotLocal(){ const cols = {}; COLS.forEach(c => { cols[c] = S[c] || {}; }); return { cols, del:readDel() }; }
// Per-document last-write-wins on the _t stamp; deletion records win over older copies.
function mergeSnap(a, b){
  const out = { cols:{}, del:Object.assign({}, a.del || {}) };

  Object.entries(b.del || {}).forEach(([k, t]) => { if (!(out.del[k] >= t)){ out.del[k] = t; changedLocal = true; } });
  Object.keys(out.del).forEach(k => { if (!((b.del || {})[k] >= out.del[k])) changedRemote = true; });

    const A = (a.cols && a.cols[c]) || {}, B = (b.cols && b.cols[c]) || {}, o = {};

      const x = A[id], y = B[id], tx = x ? (x._t || 0) : -1, ty = y ? (y._t || 0) : -1;

      if (dt && dt >= tp){ if (x) changedLocal = true; if (y) changedRemote = true; return; }
      o[id] = pick;
      if (c === 'meta'){
        if (JSON.stringify(pick) !== JSON.stringify(x)) changedLocal = true;
        if (JSON.stringify(pick) !== JSON.stringify(y)) changedRemote = true;
      } else {

}

}

let dayTransition = null, dayRun = 0, weekBase = null, weekPending = null, weekResetting = false, weekGesture = false, weekPointer = false;
const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const motionTime = name => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || 200;
function dayShellVisible(){ return ['pred','review','capture'].includes(route) && (!form || (form.type === 'capture' && form.key === 'new')); }
function cancelDayMotion(){

  document.documentElement.classList.remove('day-transition');
  [$('#view'), $('#day-label')].forEach(el => { el.classList.remove('enter-prev','enter-next'); el.getAnimations().forEach(a => a.cancel()); });

function enterDay(direction){

  [$('#view'), $('#day-label')].forEach(el => {
    el.classList.remove('enter-prev','enter-next');
    if (reducedMotion()){ if (el.animate) el.animate([{opacity:0},{opacity:1}], {duration:100}); }
    else { void el.offsetWidth; el.classList.add(cls); }

}
function changeDay(k, fromWeek = false){
  if (!validDate(k) || k > addDays(dayKey(), 1) || k === sel) return;
  const direction = k < sel ? -1 : 1;
  cancelDayMotion(); const run = dayRun;
  sel = k; ui.cal = false;
  const top = $('#workspace').getBoundingClientRect().top + window.scrollY;
  if (window.scrollY > top) window.scrollTo({ top, behavior:'instant' });
  document.documentElement.dataset.dir = direction < 0 ? 'prev' : 'next';
  const update = () => { if (run !== dayRun) return; ui.weekFromScroll = fromWeek; render(); ui.weekFromScroll = false; };

}

function paintWeekPage(page, start){

function centerWeek(base){

function updateWeek(){

  async syncSetup(){
    const repo = ($('#sy-repo').value || '').trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, '');
    const token = ($('#sy-token').value || '').trim() || (syncCfg && syncCfg.token) || '';
    const typed = $('#sy-pass').value || '';
    const pass = typed || (syncCfg && syncCfg.pass) || '';
    const fail = m => { ui.syncErr = m; ui.syncChecking = false; render(); };
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) return fail('仓库要写成「用户名/仓库名」，比如 ProCare-creator/zwgcb-data。');
    if (!token) return fail('还没填访问密钥。');
    if (pass.length < 6) return fail('同步密码至少 6 位。');
    ui.syncErr = null; ui.syncChecking = true; render();
    let r;
    try { r = await fetch('https://api.github.com/repos/' + repo, { headers:{ Authorization:'Bearer ' + token, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' }, cache:'no-store' }); }
    catch (e){ return fail('连不上 GitHub。检查网络后再试。'); }
    if (r.status === 401) return fail('访问密钥无效或已过期。重新生成一个，完整复制后再粘贴。');
    if (r.status === 404) return fail('找不到这个仓库，或者访问密钥没有它的权限。检查仓库名，以及生成密钥时有没有勾选这个仓库。');
    if (!r.ok) return fail('GitHub 返回了错误（' + r.status + '），稍后再试。');
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (j.private === false) return fail('这个仓库是公开的。请换成私有（Private）仓库：数据虽然加密了，也不该放在公开的地方。');
    if (syncCfg && syncCfg.repo === repo && syncCfg.pass){
      // same repo: a different password is a change. Keep the current one until the next sync has
      // read the cloud copy with it and re-uploaded everything under the new one (see syncNow).
      const want = typed || syncCfg.newPass || syncCfg.pass;
      const next = { repo, token, pass:syncCfg.pass, lastAt:syncCfg.lastAt };
      if (want !== syncCfg.pass) next.newPass = want;
      syncCfg = next;
    } else syncCfg = { repo, token, pass, lastAt:null };
    const changing = !!syncCfg.newPass;
    saveSyncCfg(); ui.syncChecking = false; ui.syncEdit = false; render();
    await syncNow(); render();
    if (syncState.ok && !changing) toast('云端同步已开启。');

  async qToggle(el){ if (!needReady()) return; const r = clone(S.archives[el.dataset.id]); if (!r) return; const i = +el.dataset.v, set = new Set(r.resolvedQ || []); if (set.has(i)) set.delete(i); else set.add(i); r.resolvedQ = Array.from(set).sort((a, b) => a - b); const p = put('archives', r.id, r); render(); try { await p; } catch (e) {} },

  arcDelNo(){ ui.arcDel = null; render(); },

function applyResults(d, R){ d.preds = d.preds.map(p => { const r = R && R[p.id]; return r ? Object.assign({}, p, { result:r.r || '', actual:(r.a || '').trim() }) : p; }); }
function applyD(k, D, writes){
  if (!D || D.op === 'none') return { op:'none' };
  const now = new Date().toISOString();
  if (D.op === 'new'){
    const sit = (D.sit || '').trim(), rea = (D.rea || '').trim();
    if (!sit && !rea) return { op:'none' };
    const h = makeHyp({ sit:sit || '（情境没写）', rea:rea || '（反应没写）', date:k, ev:[{ date:k, kind:'sup', note:(D.ev || '').trim(), str:D.str === 'weak' ? 'weak' : 'strong' }] });
    writes.push(() => put('hyps', h.id, h));
    return { op:'new', hid:h.id, text:hypNo(h) + ' ' + hypText(h), line:'<div class="hmeta"><span class="hno">' + hypNo(h) + '</span></div>' +'<div class="hmeta"><span class="st test">新假设</span></div>' + hypLines(h) };
  }
  if (D.op === 'old' && D.hid && S.hyps[D.hid]){
    const h = clone(S.hyps[D.hid]), kind = D.kind === 'con' ? 'con' : 'sup';
    h.ev = (h.ev || []).concat([{ date:k, kind, note:(D.ev || '').trim(), str:D.str === 'weak' ? 'weak' : 'strong' }]); h.updated = now;
    writes.push(() => put('hyps', h.id, h));
    return { op:'old', hid:h.id, kind, text:hypNo(h) + ' ' + hypText(h) + '（' + (kind === 'con' ? '反例' : '支持') + '）', line:'<div class="hmeta"><span class="st ' + (kind === 'con' ? 'revised' : 'test') + '">' + (kind === 'con' ? '记了一次反例' : '记了一次支持') + '</span></div>' + hypLines(h) };
  }
  return { op:'none' };
}
function applyE(k, E, prevE, writes){
  E = E || {};
  const out = { watch:(E.watch || '').trim(), tmr:(E.tmr || '').trim(), predId:prevE ? prevE.predId : null };
  const nk = addDays(k, 1);
  if (out.tmr || out.predId){
    const nd = getDay(nk);
    if (out.predId && nd.preds.some(p => p.id === out.predId)){
      if (out.tmr) nd.preds = nd.preds.map(p => p.id === out.predId ? Object.assign({}, p, { text:out.tmr }) : p);
      else { nd.preds = nd.preds.filter(p => p.id !== out.predId); out.predId = null; }
    } else if (out.tmr){
      out.predId = newId();
      nd.preds.push({ id:out.predId, kind:'specific', text:out.tmr, hid:null, at:new Date().toISOString(), src:'eve', result:'', actual:'' });
    }
    writes.push(() => put('days', nk, nd));
  }
  return out;
}
function hypToast(D){
  if (!D || D.op === 'none') return '';
  if (D.op === 'new') return '写完了。新假设进了清单。';
  const h = S.hyps[D.hid]; if (!h) return '写完了。';
  const sup = evCount(h, 'sup'), con = evCount(h, 'con');

  return '写完了。';
}
