<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自我观察本</title>
<meta name="description" content="每天的预测、随手记、复盘和自我假设清单，离线可用。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="自我观察本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#19202A" media="(prefers-color-scheme: dark)">
<style>
:root{ color-scheme:light; padding-top:env(safe-area-inset-top,0px); }
html,body{ margin:0; } img{ max-width:100%; } [hidden]{ display:none !important; }
body{ -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none; }
/* Layout: one narrow column of graph-paper notebook pages, bottom tab bar.
   Ink: blue-black fountain-pen ink for what you write; red pen only for 落空 / 反例 / 改写. */
:root{
  --paper:#F3F5F2; --grid:rgba(30,46,74,.05); --card:#FFFFFF; --field:#FAFBF9; --line:#D7DCD6;
  --ink:#1D2C45; --ink-2:#4D596B; --ink-3:#7A8494;
  --blue:#23477A; --blue-soft:rgba(35,71,122,.08); --on-blue:#FFFFFF;
  --red:#B5362B; --red-soft:rgba(181,54,43,.08);
  --green:#2C7150; --green-soft:rgba(44,113,80,.10);
  --f-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --f-hand:"Long Cang","Kaiti SC","STKaiti","KaiTi",cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11161E; --grid:rgba(223,229,238,.03); --card:#19202A; --field:#141A22; --line:#2B3442;
  --ink:#DDE4EE; --ink-2:#A6B0BF; --ink-3:#7C8797;
  --blue:#8DB1E4; --blue-soft:rgba(141,177,228,.12); --on-blue:#0E1623;
  --red:#EA7A6D; --red-soft:rgba(234,122,109,.12);
  --green:#6CC296; --green-soft:rgba(108,194,150,.12);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#11161E; --grid:rgba(223,229,238,.03); --card:#19202A; --field:#141A22; --line:#2B3442;
  --ink:#DDE4EE; --ink-2:#A6B0BF; --ink-3:#7C8797;
  --blue:#8DB1E4; --blue-soft:rgba(141,177,228,.12); --on-blue:#0E1623;
  --red:#EA7A6D; --red-soft:rgba(234,122,109,.12);
  --green:#6CC296; --green-soft:rgba(108,194,150,.12);
  color-scheme:dark;
}
html{ -webkit-text-size-adjust:100%; }
body{
  background-color:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; background-attachment:fixed;
}
*{ box-sizing:border-box; }
button,input,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
#app{ max-width:600px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:14px calc(96px + env(safe-area-inset-bottom,0px)); }
.top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
.brand{ font-family:var(--f-display); font-weight:700; font-size:18px; letter-spacing:.06em; }
.sync{ font-family:var(--f-mono); font-size:11px; color:var(--ink-3); border:1px solid var(--line); border-radius:999px; padding:2px 9px; white-space:nowrap; background:var(--card); }
.sync.warn{ color:var(--red); border-color:var(--red); }
.mono{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
.muted{ color:var(--ink-2); margin:0; }
.fine{ color:var(--ink-3); font-size:12.5px; margin:0; }
h1.h{ font-family:var(--f-display); font-size:24px; font-weight:700; margin:0 0 4px; text-wrap:balance; letter-spacing:.02em; }
h2.h2{ font-family:var(--f-display); font-size:17px; font-weight:600; margin:26px 0 10px; }
.lede{ color:var(--ink-2); margin:0 0 16px; }
.stack{ display:flex; flex-direction:column; gap:12px; }
.row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; min-width:0; }
.stage{ display:flex; align-items:baseline; gap:8px; font-weight:600; font-size:15px; }
.stage .tag{ font-family:var(--f-mono); font-size:11px; font-weight:500; color:var(--ink-3); letter-spacing:.04em; }
.stage .right{ margin-left:auto; font-family:var(--f-mono); font-size:11.5px; font-weight:400; color:var(--ink-3); }
.btn{ border:1px solid var(--blue); background:var(--blue); color:var(--on-blue); border-radius:8px; padding:9px 14px; font-weight:600; font-size:14.5px; text-decoration:none; display:inline-flex; align-items:center; gap:6px; line-height:1.3; }
.btn.ghost{ background:transparent; color:var(--ink); border-color:var(--line); font-weight:500; }
.btn.ghost:hover{ border-color:var(--ink-3); }
.btn.sm{ padding:6px 11px; font-size:13.5px; }
.btn.red{ background:var(--red); border-color:var(--red); }
.btn[disabled]{ opacity:.5; cursor:default; }
.linkbtn{ border:0; background:none; padding:0; color:var(--blue); font-size:13.5px; text-decoration:underline; text-underline-offset:3px; }
.dayhead{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:14px; }
.date{ font-family:var(--f-display); font-size:30px; font-weight:700; line-height:1.15; letter-spacing:.02em; }
.date span{ font-size:16px; color:var(--ink-2); font-weight:600; margin-left:4px; }
.sub{ font-size:12px; color:var(--ink-3); }

/* field */
.f{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.f>label,.lab{ font-size:13.5px; font-weight:600; color:var(--ink-2); }
.f .hint{ font-size:12.5px; color:var(--ink-3); }
textarea,input[type=text]{ width:100%; border:1px solid var(--line); background:var(--field); border-radius:8px; padding:9px 11px; font-size:16px; line-height:1.5; }
textarea{ resize:vertical; min-height:44px; }
textarea:focus,input[type=text]:focus{ outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft); }
.pair{ display:grid; grid-template-columns:auto 1fr; gap:6px 8px; align-items:center; }
.pair span{ font-size:14px; color:var(--ink-2); white-space:nowrap; }
.warn{ font-size:12.5px; color:var(--red); }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ border:1px solid var(--line); background:var(--card); border-radius:999px; padding:5px 11px; font-size:13.5px; line-height:1.35; color:var(--ink); }
.chip.on{ background:var(--blue-soft); border-color:var(--blue); color:var(--blue); font-weight:600; }
.chip.red.on{ background:var(--red-soft); border-color:var(--red); color:var(--red); }
.chip.green.on{ background:var(--green-soft); border-color:var(--green); color:var(--green); }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex-wrap:wrap; }
.seg button{ border:0; background:var(--card); padding:6px 12px; font-size:13.5px; border-right:1px solid var(--line); }
.seg button:last-child{ border-right:0; }
.seg button.on{ background:var(--blue); color:var(--on-blue); font-weight:600; }
.sec{ display:flex; flex-direction:column; gap:12px; padding-top:4px; }
.sec-h{ display:flex; align-items:baseline; gap:10px; font-weight:700; font-size:15.5px; border-bottom:1px solid var(--line); padding-bottom:6px; margin-top:8px; }
.sec-h .mono{ color:var(--blue); font-size:13px; }
.sec-h .t{ margin-left:auto; font-family:var(--f-mono); font-size:11.5px; color:var(--ink-3); font-weight:400; }

/* predictions */
.preds{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.pred{ position:relative; padding:8px 34px 8px 12px; border-left:2px solid var(--blue); background:var(--blue-soft); border-radius:0 8px 8px 0; }
.pred.r-miss,.pred.r-half{ border-left-color:var(--red); background:var(--red-soft); }
.pk{ font-size:12px; color:var(--ink-3); display:flex; gap:8px; flex-wrap:wrap; }
.pt{ font-size:15px; }
.pa{ font-size:13.5px; color:var(--ink-2); }
.pen{ font-family:var(--f-hand); color:var(--red); font-size:22px; line-height:1; position:absolute; right:10px; top:8px; transform:rotate(-6deg); }
.pen.hit{ color:var(--green); }
.x{ position:absolute; right:6px; top:6px; border:0; background:none; color:var(--ink-3); font-size:18px; line-height:1; padding:4px 6px; }

/* week grid */
.grid5{ display:grid; grid-template-columns:repeat(7,minmax(0,28px)); gap:6px; }
.grid5 .wd{ font-size:11px; color:var(--ink-3); text-align:center; font-family:var(--f-mono); }
.cell{ aspect-ratio:1; max-width:100%; border-radius:4px; border:1px solid var(--line); background:transparent; position:relative; }
.cell.std{ background:var(--blue); border-color:var(--blue); }
.cell.min{ background:linear-gradient(135deg,var(--blue) 0 50%,transparent 50%); border-color:var(--blue); }
.cell.part{ border:2px solid var(--blue); }
.cell.skip{ background:repeating-linear-gradient(135deg,var(--ink-3) 0 1.5px,transparent 1.5px 6px); border-color:var(--ink-3); }
.cell.none{ border-style:dashed; }
.cell.future{ opacity:.35; border-style:dotted; }
.cell.today{ box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--red); }
.legend{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11.5px; color:var(--ink-3); }
.legend i{ display:inline-block; width:11px; height:11px; vertical-align:-1px; margin-right:4px; border-radius:2px; border:1px solid var(--line); }
.legend i.std{ background:var(--blue); border-color:var(--blue); }
.legend i.min{ background:linear-gradient(135deg,var(--blue) 0 50%,transparent 50%); border-color:var(--blue); }
.legend i.part{ border:2px solid var(--blue); }
.legend i.skip{ background:repeating-linear-gradient(135deg,var(--ink-3) 0 1.5px,transparent 1.5px 4px); border-color:var(--ink-3); }
.legend i.none{ border-style:dashed; }
.figs{ display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13.5px; color:var(--ink-2); }
.figs b{ font-family:var(--f-mono); color:var(--ink); font-weight:500; font-size:16px; margin:0 2px; }
.figs .redb b{ color:var(--red); }
.note{ font-size:13px; color:var(--ink-2); border-top:1px dashed var(--line); padding-top:8px; margin:0; }

/* captures */
.cap{ border:1px solid var(--line); border-radius:10px; background:var(--card); padding:12px 14px; display:flex; flex-direction:column; gap:6px; min-width:0; }
.cap.fresh{ border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft); }
.cap-top{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-3); }
.cap-top .mono{ color:var(--ink); font-size:13px; }
.emo{ display:inline-flex; align-items:center; gap:6px; color:var(--ink); font-size:13px; font-weight:600; }
.bars{ display:inline-flex; gap:2px; }
.bars i{ width:5px; height:11px; border-radius:1px; background:var(--line); display:block; }
.bars i.on{ background:var(--red); }
.quote{ font-family:var(--f-display); font-size:17px; font-weight:600; line-height:1.5; margin:2px 0; overflow-wrap:anywhere; }
.quote::before{ content:"「"; color:var(--ink-3); } .quote::after{ content:"」"; color:var(--ink-3); }
.kv{ display:grid; grid-template-columns:4.6em 1fr; gap:2px 8px; font-size:14px; }
.kv dt{ color:var(--ink-3); } .kv dd{ margin:0; overflow-wrap:anywhere; min-width:0; }
.care{ font-size:14px; border-top:1px dashed var(--line); padding-top:6px; }
.care b{ color:var(--blue); font-weight:600; }
.pending{ font-size:12px; color:var(--red); }
.tagline{ display:flex; gap:6px; flex-wrap:wrap; }
.tg{ font-size:11.5px; border:1px solid var(--line); border-radius:4px; padding:0 6px; color:var(--ink-2); }
.capmini{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:14px; }
.capmini li{ display:flex; gap:8px; min-width:0; }
.capmini .mono{ color:var(--ink-3); font-size:12.5px; flex:none; padding-top:2px; }
.capmini span.txt{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* hypotheses: index cards */
.hyp{ background:var(--card); border:1px solid var(--line); border-radius:6px; padding:14px 16px 12px; display:flex; flex-direction:column; gap:8px; background-image:linear-gradient(var(--card) 30px,transparent 30px),repeating-linear-gradient(transparent 0 25px,var(--grid) 25px 26px); min-width:0; }
.hyp.solid{ border-color:var(--green); }
.hyp.revised .hs{ text-decoration:line-through; text-decoration-color:var(--red); text-decoration-thickness:1.5px; color:var(--ink-3); }
.hyp.example{ opacity:.7; border-style:dashed; }
.hs{ font-size:16px; line-height:1.55; overflow-wrap:anywhere; }
.hs .pre{ color:var(--ink-3); font-size:13.5px; margin-right:4px; }
.hmeta{ display:flex; flex-wrap:wrap; gap:4px 16px; align-items:center; font-size:12.5px; color:var(--ink-3); }
.tally{ display:inline-flex; align-items:center; gap:5px; color:var(--ink-2); }
.tally svg{ display:block; }
.tally.con{ color:var(--red); }
.st{ font-size:11.5px; border-radius:4px; padding:1px 7px; font-weight:600; }
.st.test{ background:var(--blue-soft); color:var(--blue); }
.st.solid{ background:var(--green-soft); color:var(--green); }
.st.revised{ background:var(--red-soft); color:var(--red); }
.evs{ list-style:none; margin:0; padding:0; font-size:13px; color:var(--ink-2); display:flex; flex-direction:column; gap:2px; }
.evs .c{ color:var(--red); }
.suggest{ font-size:13px; color:var(--green); }
.suggest.r{ color:var(--red); }
.inline{ border-top:1px dashed var(--line); padding-top:10px; display:flex; flex-direction:column; gap:8px; }

/* banners */
.banner{ border-color:var(--red); }
.banner .stage{ color:var(--red); }
.fuse{ border-color:var(--red); background:var(--red-soft); }
.copybox textarea{ min-height:180px; font-family:var(--f-mono); font-size:12.5px; }

/* log */
.logrow{ display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:8px; width:100%; text-align:left; }
.logrow .cell{ width:16px; flex:none; }
.logrow .d{ font-family:var(--f-mono); font-size:13.5px; flex:none; width:6.5em; }
.logrow .s{ font-size:13px; color:var(--ink-2); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
.detail{ border-left:2px solid var(--line); margin:4px 0 8px 8px; padding:4px 0 4px 14px; display:flex; flex-direction:column; gap:10px; }

/* tabs */
.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--card); border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px)); padding-right:max(8px,env(safe-area-inset-right,0px)); padding-bottom:env(safe-area-inset-bottom,0px); }
.tabs .in{ max-width:600px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); }
.tabs a{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 2px 9px; text-decoration:none; color:var(--ink-3); font-size:12px; }
.tabs a svg{ width:22px; height:22px; }
.tabs a.on{ color:var(--blue); font-weight:600; }
.tabs a.cap-tab .dot{ width:38px; height:38px; margin-top:-16px; border-radius:50%; background:var(--blue); color:var(--on-blue); display:grid; place-items:center; box-shadow:0 0 0 4px var(--card); }
.tabs a.cap-tab .dot svg{ width:20px; height:20px; }
#toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--paper); padding:8px 14px; border-radius:8px; font-size:14px; z-index:9; max-width:calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference){ .cap.fresh{ transition:box-shadow .6s; } }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">自我观察本</div>
    <div class="sync" id="sync">连接中</div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="页面">
  <div class="in">
    <a href="#today" data-r="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M9 3v4M15 3v4"/></svg>今天</a>
    <a href="#log" data-r="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 4h10l3 3v13H6z"/><path d="M9 10h7M9 14h7M9 18h4"/></svg>记录</a>
    <a href="#capture" data-r="capture" class="cap-tab"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></span>随手记</a>
    <a href="#hyps" data-r="hyps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="1.5"/><path d="M3 10h18M7 14h6"/></svg>假设清单</a>
    <a href="#week" data-r="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg>周复盘</a>
  </div>
</nav>
<div id="toast" hidden></div>

<script>
(() => {
'use strict';
/* ---------- constants ---------- */
const KINDS = { avoid:'最可能拖着不做的事', emotion:'最可能让我情绪起伏的', specific:'具体预测' };
const SRC = { morning:'早上写', late:'补写', eve:'前晚出题' };
const RES = { hit:'对', miss:'落空', half:'一半' };
const EMOS = ['焦虑','烦躁','委屈','失落','羞愧','愤怒','紧张','无力','不耐烦','兴奋','被认可','平静'];
const BODY = ['胸闷','肩颈紧','心跳快','胃里发紧','脸发热','坐不住','想逃开','没力气','呼吸浅','放松'];
const TAGS = ['预测落空','不像自己','拖延','冲突','纠结','高光'];
const SKIPR = ['太累','忘了','不想面对','没时间','其他'];
const VAGUE = ['充实','好好','努力','认真','尽量','高效','顺利','不错','加油','开心','积极','争取','适当','多一点','少一点','状态好'];
const MOMENTS = ['情绪最强的一刻','最不像自己的一刻','最有劲的一刻','别的时刻'];
const LS_KEY = 'zwgcb-data-v1', LS_DRAFT = 'zwgcb-drafts-v1';

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = k => { const a = k.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const dayKey = (d = new Date()) => ymd(new Date(d.getTime() - 4 * 3600e3));
const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return ymd(d); };
const weekStart = k => { const d = parse(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
const hm = iso => { const d = new Date(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const md = k => { const p = k.split('-'); return (+p[1]) + '月' + (+p[2]) + '日'; };
const mdShort = k => { const p = k.split('-'); return p[1] + '·' + p[2]; };
const wdOf = k => '周' + '日一二三四五六'[parse(k).getDay()];
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const newDay = k => ({ date:k, preds:[], caps:[], evening:null, skip:null });
const getDay = k => clone(S.days[k]) || newDay(k);
const hypText = h => '在' + h.sit + '时，我可能会' + h.rea;
function setPath(o, path, v){ const ps = path.split('.'); let c = o; for (let i = 0; i < ps.length - 1; i++){ if (c[ps[i]] == null || typeof c[ps[i]] !== 'object') c[ps[i]] = {}; c = c[ps[i]]; } c[ps[ps.length - 1]] = v; }
function getPath(o, path){ return path.split('.').reduce((c, p) => c == null ? undefined : c[p], o); }
let toastT = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }
function errMsg(e){
  const c = e && e.code;
  if (c === 'quota_exceeded') return '存储空间满了，先在「记录」里导出一份备份。';
  if (c === 'revoked' || c === 'not_granted') return '这个页面暂时不能保存了，刷新试试。';
  if (c === 'invalid_argument') return '这次没存上：当前身份没有写入权限。';
  return '这次没存上，网络恢复后再点一次保存。';
}

/* ---------- state ---------- */
let S = { days:{}, hyps:{}, weeks:{} };
let mode = 'init';           // init | cloud | local
let ready = false, slow = false, migrated = false;
let route = 'today';
let form = null;             // {type, key, data, dirty}
let ui = { skipOpen:false, logOpen:null, hypOpen:null, hypNew:false, copy:null, fresh:null, weekKey:null };
let drafts = {};
try { drafts = JSON.parse(localStorage.getItem(LS_DRAFT) || '{}') || {}; } catch (e) { drafts = {}; }
let dlNs = null;

/* ---------- storage ---------- */
let base = null;
const queues = {};
function lsWrite(){ try { localStorage.setItem(LS_KEY, JSON.stringify({ days:S.days, hyps:S.hyps, weeks:S.weeks, savedAt:Date.now() })); return true; } catch (e) { return false; } }
function lsRead(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } }
function put(col, id, data){
  S[col] = Object.assign({}, S[col]); S[col][id] = data;
  if (mode === 'cloud'){
    const path = col + '/' + id;
    const p = (queues[path] || Promise.resolve()).catch(() => {}).then(() => base.collection(col).doc(id).set(data));
    queues[path] = p;
    return p.catch(e => { toast(errMsg(e)); throw e; });
  }
  if (!lsWrite()) toast('这个浏览器不允许保存，刷新后会丢失。');
  return Promise.resolve();
}
function remove(col, id){
  S[col] = Object.assign({}, S[col]); delete S[col][id];
  if (mode === 'cloud'){
    const path = col + '/' + id;
    const p = (queues[path] || Promise.resolve()).catch(() => {}).then(() => base.collection(col).doc(id).delete());
    queues[path] = p;
    return p.catch(e => { toast(errMsg(e)); throw e; });
  }
  lsWrite(); return Promise.resolve();
}
function saveDrafts(){ try { localStorage.setItem(LS_DRAFT, JSON.stringify(drafts)); } catch (e) {} }
let draftT = null;
function draftLater(){ clearTimeout(draftT); draftT = setTimeout(saveDrafts, 400); }

function useLocal(){
  if (mode === 'cloud') return;
  mode = 'local';
  const l = lsRead();
  if (l){ S = { days:l.days || {}, hyps:l.hyps || {}, weeks:l.weeks || {} }; }
  ready = true; refresh();
}
function startCloud(db, uid){
  mode = 'cloud';
  base = db.doc('data/users/' + uid + '/main');
  const loaded = {}, definite = {};
  const slowT = setTimeout(() => { if (!(definite.days && definite.hyps && definite.weeks)){ slow = true; syncLabel(); } }, 10000);
  const done = () => {
    if (loaded.days && loaded.hyps && loaded.weeks && !ready){ ready = true; }
    if (definite.days && definite.hyps && definite.weeks){ clearTimeout(slowT); slow = false; migrate(); }
    refresh();
  };
  const sub = (col, q) => q.onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
    S[col] = o; loaded[col] = true; if (!snap.metadata.fromCache) definite[col] = true; done();
  }, err => { clearTimeout(slowT); slow = true; loaded[col] = true; definite[col] = true; toast(errMsg(err)); done(); });
  sub('days', base.collection('days').orderBy('date', 'desc').limit(600));
  sub('hyps', base.collection('hyps'));
  sub('weeks', base.collection('weeks'));
}
async function migrate(){
  if (migrated) return; migrated = true;
  const l = lsRead(); if (!l) return;
  let n = 0;
  for (const col of ['days','hyps','weeks']){
    for (const id of Object.keys(l[col] || {})){
      if (!S[col][id]){ try { await put(col, id, l[col][id]); n++; } catch (e) { return; } }
    }
  }
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  if (n) toast('这台设备上之前的 ' + n + ' 条记录已同步。');
}
function refresh(){
  syncLabel();
  if (!form || !form.dirty){ if (!ui.hypOpen && !ui.hypNew) render(); }
}
function syncLabel(){
  const el = $('#sync');
  let t = '连接中', w = false;
  if (mode === 'cloud') { t = !ready ? '载入中' : slow ? '连接慢，可能不是最新' : '已同步 · 仅自己可见'; w = slow; }
  else if (mode === 'local') { t = '离线可用 · 存在这部手机'; w = false; }
  el.textContent = t; el.classList.toggle('warn', w);
}
function saveFile(filename, data){
  const type = /\.docx$/.test(filename) ? 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' : 'application/json';
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  const download = () => {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
    return { status:'saved' };
  };
  let file = null; try { file = new File([blob], filename, { type }); } catch (e) {}
  const touch = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  let shareable = false;
  if (touch && file && navigator.share && navigator.canShare){ try { shareable = navigator.canShare({ files:[file] }); } catch (e) {} }
  if (shareable){
    return navigator.share({ files:[file], title:filename }).then(() => ({ status:'saved' }), err => {
      if (err && err.name === 'AbortError') throw { code:'declined' };
      return download();
    });
  }
  return Promise.resolve(download());
}
function importFile(f){
  const r = new FileReader();
  r.onload = () => {
    let o = null; try { o = JSON.parse(r.result); } catch (e) {}
    if (!o || typeof o !== 'object' || !o.days || typeof o.days !== 'object'){ toast('这个文件里没有自我观察本的记录。确认是从「导出备份」得到的 JSON。'); return; }
    let n = 0, skipped = 0;
    ['days','hyps','weeks'].forEach(col => {
      const src = (o[col] && typeof o[col] === 'object') ? o[col] : {};
      Object.keys(src).forEach(id => { if (!S[col][id]){ S[col][id] = src[id]; n++; } else skipped++; });
    });
    if (!lsWrite()){ toast('没导入成功：这个浏览器不允许存储。'); return; }
    toast('导入了 ' + n + ' 条' + (skipped ? '，跳过 ' + skipped + ' 条这里已经有的' : '') + '。');
    render();
  };
  r.onerror = () => toast('这个文件读不出来。');
  r.readAsText(f);
}
function backupLine(){
  if (Object.keys(S.days).length < 3) return '';
  let lb = null; try { lb = localStorage.getItem('zwgcb-lastbackup'); } catch (e) {}
  if (!lb) return '<p class="warn" style="margin:0">记录只存在这部手机里，还没导出过备份。去「记录」页导出一份。</p>';
  const n = Math.round((parse(dayKey()) - parse(lb)) / 864e5);
  return n >= 7 ? '<p class="warn" style="margin:0">上次导出备份是 ' + n + ' 天前，去「记录」页再导一份。</p>' : '';
}
async function init(){
  dlNs = { save:({ filename, data }) => saveFile(filename, data) };
  useLocal();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}

/* ---------- derived ---------- */
function dayStatus(k, t){
  if (k > t) return 'future';
  const d = S.days[k]; if (!d) return 'none';
  if (d.evening) return d.evening.mode === 'std' ? 'std' : 'min';
  if (d.skip) return 'skip';
  if ((d.preds && d.preds.length) || (d.caps && d.caps.length)) return 'part';
  return 'none';
}
function firstDay(){
  let f = null;
  for (const k in S.days){ const d = S.days[k]; if ((d.preds && d.preds.some(p => p.src !== 'eve')) || (d.caps && d.caps.length) || d.evening || d.skip){ if (!f || k < f) f = k; } }
  return f;
}
const evCount = (h, kind) => (h.ev || []).filter(e => e.kind === kind).length;
function weekData(ws){
  const we = addDays(ws, 6), t = dayKey();
  const r = { ws, we, days:[], misses:[], surprises:[], skips:{}, emos:{}, tags:{}, capN:0, intSum:0, intN:0, preds:0, late:0, rec:0, newHyps:[], sup:0, con:0, revised:[], newInfo:0, heavy:0 };
  for (let i = 0; i < 7; i++){
    const k = addDays(ws, i), st = dayStatus(k, t), d = S.days[k];
    r.days.push({ k, st });
    if (st === 'std' || st === 'min') r.rec++;
    if (!d) continue;
    (d.preds || []).forEach(p => { if (k > t) return; r.preds++; if (p.src === 'late') r.late++; if (p.result === 'miss' || p.result === 'half') r.misses.push(Object.assign({ k }, p)); });
    (d.caps || []).forEach(c => { r.capN++; (c.emos || []).forEach(e => { r.emos[e] = (r.emos[e] || 0) + 1; }); if (c.inten){ r.intSum += c.inten; r.intN++; } (c.tags || []).forEach(g => { r.tags[g] = (r.tags[g] || 0) + 1; }); });
    if (d.skip) r.skips[d.skip.reason] = (r.skips[d.skip.reason] || 0) + 1;
    if (d.evening && d.evening.surprise) r.surprises.push({ k, text:d.evening.surprise });
    if (d.evening && d.evening.after === 'heavy') r.heavy++;
  }
  Object.values(S.hyps).forEach(h => {
    if (h.created >= ws && h.created <= we) r.newHyps.push(h);
    (h.ev || []).forEach(e => { if (e.date >= ws && e.date <= we){ if (e.kind === 'sup') r.sup++; else r.con++; } });
    if (h.status === 'revised' && h.revisedOn >= ws && h.revisedOn <= we) r.revised.push(h);
  });
  r.newInfo = r.misses.length + r.surprises.length + (r.tags['不像自己'] || 0) + r.con + r.revised.length;
  return r;
}
function lastRevision(){ let l = null; Object.values(S.hyps).forEach(h => { if (h.status === 'revised' && h.revisedOn && (!l || h.revisedOn > l)) l = h.revisedOn; }); return l; }
function fuseOn(){
  const t = dayKey();
  const ev = Object.values(S.days).filter(d => d.evening && d.evening.after && d.date >= addDays(t, -6)).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
  return ev.length === 3 && ev.every(d => d.evening.after === 'heavy');
}
const openHyps = () => Object.values(S.hyps).filter(h => h.status !== 'revised').sort((a, b) => (b.updated || '').localeCompare(a.updated || ''));

/* ---------- small renderers ---------- */
function tally(n){
  const full = Math.floor(n / 5), rem = n % 5, strokes = ['M2 2.5H12','M7 2.5V12.5','M7 7.5H11','M3.5 7.5V12.5','M1.5 12.5H12.5'];
  const glyph = k => '<svg width="14" height="15" viewBox="0 0 14 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="' + strokes.slice(0, k).join('') + '"/></svg>';
  if (n === 0) return '<span class="mono">0</span>';
  if (full > 3) return '<span class="mono">' + n + '</span>';
  let s = ''; for (let i = 0; i < full; i++) s += glyph(5); if (rem) s += glyph(rem);
  return s + '<span class="mono">' + n + '</span>';
}
function bars(n){ let s = '<span class="bars" aria-label="强度 ' + (n || 0) + '/5">'; for (let i = 1; i <= 5; i++) s += '<i class="' + (i <= n ? 'on' : '') + '"></i>'; return s + '</span>'; }
function predRow(p, k, removable){
  const r = p.result ? ' r-' + p.result : '';
  return '<li class="pred' + r + '"><div class="pk"><span>' + KINDS[p.kind] + '</span><span class="mono">' + hm(p.at) + ' · ' + SRC[p.src] + '</span></div>'
    + '<div class="pt">' + esc(p.text) + '</div>'
    + (p.actual ? '<div class="pa">实际：' + esc(p.actual) + '</div>' : '')
    + (p.result ? '<span class="pen ' + p.result + '">' + RES[p.result] + '</span>' : '')
    + (removable && !p.result ? '<button type="button" class="x" data-act="delPred" data-key="' + k + '" data-id="' + p.id + '" aria-label="删掉这条预测">×</button>' : '')
    + '</li>';
}
function capCardHTML(c, k, opts){
  opts = opts || {};
  const emo = (c.emos || []).join(' · ');
  const kv = [];
  if (c.fact) kv.push(['发生', c.fact]);
  if (c.body && c.body.length) kv.push(['身体', c.body.join(' · ')]);
  if (c.did) kv.push(['我做了', c.did]);
  if (c.wanted) kv.push(['想做没做', c.wanted]);
  return '<article class="cap' + (ui.fresh === c.id ? ' fresh' : '') + '">'
    + '<div class="cap-top"><span class="mono">' + (opts.date ? mdShort(k) + ' ' : '') + hm(c.at) + '</span>'
    + (emo ? '<span class="emo">' + esc(emo) + ' ' + bars(c.inten || 0) + '</span>' : '')
    + ((c.tags && c.tags.length) ? '<span class="tagline">' + c.tags.map(g => '<span class="tg">' + esc(g) + '</span>').join('') + '</span>' : '')
    + '</div>'
    + (c.quote ? '<div class="quote">' + esc(c.quote) + '</div>' : '')
    + (kv.length ? '<dl class="kv">' + kv.map(x => '<dt>' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd>').join('') + '</dl>' : '')
    + (c.care ? '<div class="care">碰到了我在乎的：<b>' + esc(c.care) + '</b></div>' : '')
    + (opts.actions !== false ? '<div class="row">' + (!c.done ? '<span class="pending">还没理清</span>' : '') + '<button type="button" class="linkbtn" data-act="editCap" data-key="' + k + '" data-id="' + c.id + '">' + (c.done ? '修改' : '接着理清') + '</button></div>' : '')
    + '</article>';
}
function hypLines(h){ return '<div class="hs"><span class="pre">在</span>' + esc(h.sit) + '<span class="pre">时，</span><br><span class="pre">我可能会</span>' + esc(h.rea) + '</div>'; }

/* ---------- views ---------- */
function vToday(){
  const t = dayKey(), y = addDays(t, -1), d = S.days[t] || newDay(t), yd = S.days[y], f = firstDay();
  let h = '<div class="dayhead"><div><div class="date">' + md(t) + '<span>' + wdOf(t) + '</span></div><div class="sub">复盘日以凌晨 4 点为界，凌晨写的算前一天</div></div></div>';
  h += copyBox();
  h += '<div class="stack">';
  if (ready && fuseOn()) h += '<section class="card fuse"><div class="stage">最近三次写完都觉得更沉了</div><p class="muted">这通常说明在反复咀嚼，而不是在看清自己。接下来几天只做最低版，并且用第三人称写。持续一周以上的话，找一个信任的人当面聊聊。</p></section>';
  if (ready && f && f <= y && !(yd && (yd.evening || yd.skip))) h += yBanner(y);
  h += statsCard(t);
  const dow = parse(t).getDay();
  if (ready && (dow === 0 || dow === 1)){
    const ws = dow === 0 ? weekStart(t) : addDays(weekStart(t), -7);
    if (!S.weeks[ws]) h += '<section class="card"><div class="stage">周复盘<span class="right">' + mdShort(ws) + '–' + mdShort(addDays(ws, 6)) + '</span></div><p class="muted">把这周落空的预测排在一起看：有没有同一个方向的错？20 分钟。</p><div class="row"><button type="button" class="btn sm" data-act="goWeek" data-key="' + ws + '">开始周复盘</button></div></section>';
  }
  h += predCard(t, d) + capCardToday(t, d) + eveCard(t, d, yd);
  h += '</div>';
  return h;
}
function yBanner(y){
  let s = '<section class="card banner"><div class="stage">昨天（' + md(y) + '）没有收尾</div>'
    + '<p class="muted">规则只有一条：别连着空两天。可以补 2 分钟，也可以直接放过。</p>'
    + '<div class="row"><button type="button" class="btn sm" data-act="open" data-type="min" data-key="' + y + '">补记昨天 · 2 分钟</button><button type="button" class="btn ghost sm" data-act="skipOpen">放过它</button></div>';
  if (ui.skipOpen){
    s += '<div class="inline"><div class="lab">放过的原因（一下就好）</div><div class="chips">' + SKIPR.map(r => '<button type="button" class="chip" data-act="skip" data-key="' + y + '" data-v="' + r + '">' + r + '</button>').join('') + '</div>'
      + '<p class="fine">原因会出现在周复盘里。「不想面对」本身就是一条线索。</p></div>';
  }
  s += '<p class="fine">更早的空白不用补：隔太久写出来的，多半是编的。</p></section>';
  return s;
}
function statsCard(t){
  const ws = weekStart(t), start = addDays(ws, -28), w = weekData(ws);
  let g = '<div class="grid5">' + '一二三四五六日'.split('').map(x => '<div class="wd">' + x + '</div>').join('');
  for (let i = 0; i < 35; i++){ const k = addDays(start, i), st = dayStatus(k, t); g += '<div class="cell ' + st + (k === t ? ' today' : '') + '" title="' + md(k) + '"></div>'; }
  g += '</div>';
  const hs = Object.values(S.hyps), lr = lastRevision();
  const solid = hs.filter(x => x.status === 'solid').length, test = hs.filter(x => x.status === 'test').length;
  let lrLine;
  if (lr){ const days = Math.round((parse(t) - parse(lr)) / 864e5); lrLine = '上一次重新认识自己：' + (days === 0 ? '今天' : days + ' 天前') + '，改写了一条假设。'; }
  else lrLine = '还没有改写过假设。第一次改写，才算真正重新认识了自己一次。';
  return '<section class="card"><div class="stage">近五周<span class="right">本周 ' + mdShort(ws) + ' 起</span></div>' + g
    + '<div class="legend"><span><i class="std"></i>标准版</span><span><i class="min"></i>最低版</span><span><i class="part"></i>只有预测或随手记</span><span><i class="skip"></i>放过</span><span><i class="none"></i>空白</span></div>'
    + '<div class="figs"><span>本周收尾<b>' + w.rec + '</b>/ 7 天</span><span class="redb">本周新信息<b>' + w.newInfo + '</b>条</span><span>清单<b>' + (test + solid) + '</b>条（较可信 ' + solid + '）</span></div>'
    + '<p class="note">新信息 = 落空的预测 + 意外的反应 + 反例 + 改写。它们都是你对自己的看法需要更新的地方，所以这个数字越大越好。' + lrLine + '</p>' + backupLine() + '</section>';
}
function predCard(t, d){
  const hr = new Date().getHours(), isMorning = hr >= 4 && hr < 12, isNight = hr >= 18 || hr < 4;
  let s = '<section class="card"><div class="stage"><span class="tag">早</span>预测</div>';
  if (d.preds.length){
    s += '<ul class="preds">' + d.preds.map(p => predRow(p, t, !d.evening)).join('') + '</ul>';
    if (!d.evening) s += '<div class="row"><button type="button" class="btn ghost sm" data-act="open" data-type="morning" data-key="' + t + '">再加一条</button></div>';
  } else if (!ready){
    s += '<p class="muted">正在打开记录本…</p>';
  } else if (isMorning){
    s += '<p class="muted">1 分钟，写 2–3 条晚上能判对错的预测。写错了正好。</p><div class="row"><button type="button" class="btn" data-act="open" data-type="morning" data-key="' + t + '">写今天的预测</button></div>';
  } else if (!isNight){
    s += '<p class="muted">上午过去了。现在补写也有用，但只预测接下来还没发生的事。</p><div class="row"><button type="button" class="btn" data-act="open" data-type="morning" data-key="' + t + '">补写预测</button></div>';
  } else {
    s += '<p class="muted">今天没写预测，没关系。晚上复盘时，「对照」会换成「意外回看」。复盘最后可以给明天出一道题，明早就不用再想。</p><div class="row"><button type="button" class="btn ghost sm" data-act="open" data-type="morning" data-key="' + t + '">还是补一条</button></div>';
  }
  return s + '</section>';
}
function capCardToday(t, d){
  const cs = (d.caps || []).slice().sort((a, b) => b.at.localeCompare(a.at));
  let s = '<section class="card"><div class="stage"><span class="tag">日间</span>随手记<span class="right">' + cs.length + ' 条</span></div>';
  if (cs.length) s += '<ul class="capmini">' + cs.slice(0, 4).map(c => '<li><span class="mono">' + hm(c.at) + '</span><span class="txt">' + esc((c.emos || []).join('·')) + (c.emos && c.emos.length ? ' ｜ ' : '') + esc(c.fact || c.quote || '') + '</span></li>').join('') + '</ul>';
  else s += '<p class="muted">情绪起伏、反应出乎自己意料、或者卡住的时候，当场记一句。晚上深挖可以直接选它。</p>';
  return s + '<div class="row"><a class="btn ghost sm" href="#capture">记一笔</a></div></section>';
}
function eveCard(t, d, yd){
  let s = '<section class="card"><div class="stage"><span class="tag">晚</span>复盘</div>';
  if (d.evening){
    const e = d.evening, D = e.D || {};

    return { op:'old', hid:h.id, kind, text:hypText(h) + '（' + (kind === 'con' ? '反例' : '支持') + '）', line:'<div class="hmeta"><span class="st ' + (kind === 'con' ? 'revised' : 'test') + '">' + (kind === 'con' ? '记了一次反例' : '记了一次支持') + '</span></div>' + hypLines(h) };
  }
  return { op:'none' };
}
function applyE(k, E, prevE, writes){
  E = E || {};
  const out = { watch:(E.watch || '').trim(), tmr:(E.tmr || '').trim(), predId:prevE ? prevE.predId : null };
  const nk = addDays(k, 1);
  if (out.tmr || out.predId){
    const nd = getDay(nk);
    if (out.predId && nd.preds.some(p => p.id === out.predId)){
      if (out.tmr) nd.preds = nd.preds.map(p => p.id === out.predId ? Object.assign({}, p, { text:out.tmr }) : p);
      else { nd.preds = nd.preds.filter(p => p.id !== out.predId); out.predId = null; }
    } else if (out.tmr){
      out.predId = newId();
      nd.preds.push({ id:out.predId, kind:'specific', text:out.tmr, hid:null, at:new Date().toISOString(), src:'eve', result:'', actual:'' });
    }
    writes.push(() => put('days', nk, nd));
  }
  return out;
}
function hypToast(D){
  if (!D || D.op === 'none') return '';
  if (D.op === 'new') return '写完了。新假设进了清单。';
  const h = S.hyps[D.hid]; if (!h) return '写完了。';
  const sup = evCount(h, 'sup'), con = evCount(h, 'con');
  if (D.kind === 'con') return '记了一次反例。去清单里缩小它的条件。';
  if (h.status === 'test' && sup >= 3 && con === 0) return '这条已经支持 ' + sup + ' 次，可以在清单里升为「较可信」。';
  return '写完了。';
}
