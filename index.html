<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自我观察本</title>
<meta name="description" content="每天的预测、随手记、复盘和自我假设清单，离线可用。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="自我观察本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#19202A" media="(prefers-color-scheme: dark)">
<style>
:root{ color-scheme:light; padding-top:env(safe-area-inset-top,0px); }
html,body{ margin:0; } img{ max-width:100%; } [hidden]{ display:none !important; }
body{ -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none; }
/* Layout: one narrow column of graph-paper notebook pages, bottom tab bar.
   Ink: blue-black fountain-pen ink for what you write; red pen only for 落空 / 反例 / 改写. */
:root{
  --paper:#F3F5F2; --grid:rgba(30,46,74,.05); --card:#FFFFFF; --field:#FAFBF9; --line:#D7DCD6;
  --ink:#1D2C45; --ink-2:#4D596B; --ink-3:#7A8494;
  --blue:#23477A; --blue-soft:rgba(35,71,122,.08); --on-blue:#FFFFFF;
  --red:#B5362B; --red-soft:rgba(181,54,43,.08);
  --green:#2C7150; --green-soft:rgba(44,113,80,.10);
  --f-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --f-hand:"Long Cang","Kaiti SC","STKaiti","KaiTi",cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11161E; --grid:rgba(223,229,238,.03); --card:#19202A; --field:#141A22; --line:#2B3442;
  --ink:#DDE4EE; --ink-2:#A6B0BF; --ink-3:#7C8797;
  --blue:#8DB1E4; --blue-soft:rgba(141,177,228,.12); --on-blue:#0E1623;
  --red:#EA7A6D; --red-soft:rgba(234,122,109,.12);
  --green:#6CC296; --green-soft:rgba(108,194,150,.12);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#11161E; --grid:rgba(223,229,238,.03); --card:#19202A; --field:#141A22; --line:#2B3442;
  --ink:#DDE4EE; --ink-2:#A6B0BF; --ink-3:#7C8797;
  --blue:#8DB1E4; --blue-soft:rgba(141,177,228,.12); --on-blue:#0E1623;
  --red:#EA7A6D; --red-soft:rgba(234,122,109,.12);
  --green:#6CC296; --green-soft:rgba(108,194,150,.12);
  color-scheme:dark;
}
html{ -webkit-text-size-adjust:100%; }
body{
  background-color:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; background-attachment:fixed;
}
*{ box-sizing:border-box; }
button,input,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
#app{ max-width:600px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:14px calc(96px + env(safe-area-inset-bottom,0px)); }
.top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
.brand{ font-family:var(--f-display); font-weight:700; font-size:18px; letter-spacing:.06em; }
.sync{ font-family:var(--f-mono); font-size:11px; color:var(--ink-3); border:1px solid var(--line); border-radius:999px; padding:2px 9px; white-space:nowrap; background:var(--card); }
.sync.warn{ color:var(--red); border-color:var(--red); }
.mono{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
.muted{ color:var(--ink-2); margin:0; }
.fine{ color:var(--ink-3); font-size:12.5px; margin:0; }
h1.h{ font-family:var(--f-display); font-size:24px; font-weight:700; margin:0 0 4px; text-wrap:balance; letter-spacing:.02em; }
h2.h2{ font-family:var(--f-display); font-size:17px; font-weight:600; margin:26px 0 10px; }
.lede{ color:var(--ink-2); margin:0 0 16px; }
.stack{ display:flex; flex-direction:column; gap:12px; }
.row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; min-width:0; }
.stage{ display:flex; align-items:baseline; gap:8px; font-weight:600; font-size:15px; }
.stage .tag{ font-family:var(--f-mono); font-size:11px; font-weight:500; color:var(--ink-3); letter-spacing:.04em; }
.stage .right{ margin-left:auto; font-family:var(--f-mono); font-size:11.5px; font-weight:400; color:var(--ink-3); }
.btn{ border:1px solid var(--blue); background:var(--blue); color:var(--on-blue); border-radius:8px; padding:9px 14px; font-weight:600; font-size:14.5px; text-decoration:none; display:inline-flex; align-items:center; gap:6px; line-height:1.3; }
.btn.ghost{ background:transparent; color:var(--ink); border-color:var(--line); font-weight:500; }
.btn.ghost:hover{ border-color:var(--ink-3); }
.btn.sm{ padding:6px 11px; font-size:13.5px; }
.btn.red{ background:var(--red); border-color:var(--red); }
.btn[disabled]{ opacity:.5; cursor:default; }
.linkbtn{ border:0; background:none; padding:0; color:var(--blue); font-size:13.5px; text-decoration:underline; text-underline-offset:3px; }
.dayhead{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:14px; }
.date{ font-family:var(--f-display); font-size:30px; font-weight:700; line-height:1.15; letter-spacing:.02em; }
.date span{ font-size:16px; color:var(--ink-2); font-weight:600; margin-left:4px; }
.sub{ font-size:12px; color:var(--ink-3); }

/* field */
.f{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.f>label,.lab{ font-size:13.5px; font-weight:600; color:var(--ink-2); }
.f .hint{ font-size:12.5px; color:var(--ink-3); }
textarea,input[type=text],input[type=date]{ width:100%; border:1px solid var(--line); background:var(--field); border-radius:8px; padding:9px 11px; font-size:16px; line-height:1.5; }
textarea{ resize:vertical; min-height:44px; }
input[type=date]{ min-height:44px; display:block; }
textarea:focus,input[type=text]:focus,input[type=date]:focus{ outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft); }
.pair{ display:grid; grid-template-columns:auto 1fr; gap:6px 8px; align-items:center; }
.pair span{ font-size:14px; color:var(--ink-2); white-space:nowrap; }
.warn{ font-size:12.5px; color:var(--red); }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ border:1px solid var(--line); background:var(--card); border-radius:999px; padding:5px 11px; font-size:13.5px; line-height:1.35; color:var(--ink); }
.chip.on{ background:var(--blue-soft); border-color:var(--blue); color:var(--blue); font-weight:600; }
.chip.red.on{ background:var(--red-soft); border-color:var(--red); color:var(--red); }
.chip.green.on{ background:var(--green-soft); border-color:var(--green); color:var(--green); }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex-wrap:wrap; }
.seg button{ border:0; background:var(--card); padding:6px 12px; font-size:13.5px; border-right:1px solid var(--line); }
.seg button:last-child{ border-right:0; }
.seg button.on{ background:var(--blue); color:var(--on-blue); font-weight:600; }
.sec{ display:flex; flex-direction:column; gap:12px; padding-top:4px; }
.sec-h{ display:flex; align-items:baseline; gap:10px; font-weight:700; font-size:15.5px; border-bottom:1px solid var(--line); padding-bottom:6px; margin-top:8px; }
.sec-h .mono{ color:var(--blue); font-size:13px; }
.sec-h .t{ margin-left:auto; font-family:var(--f-mono); font-size:11.5px; color:var(--ink-3); font-weight:400; }

/* predictions */
.preds{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.pred{ position:relative; padding:8px 34px 8px 12px; border-left:2px solid var(--blue); background:var(--blue-soft); border-radius:0 8px 8px 0; }
.pred.r-miss,.pred.r-half{ border-left-color:var(--red); background:var(--red-soft); }
.pk{ font-size:12px; color:var(--ink-3); display:flex; gap:8px; flex-wrap:wrap; }
.pt{ font-size:15px; }
.pa{ font-size:13.5px; color:var(--ink-2); }
.pen{ font-family:var(--f-hand); color:var(--red); font-size:22px; line-height:1; position:absolute; right:10px; top:8px; transform:rotate(-6deg); }
.pen.hit{ color:var(--green); }
.x{ position:absolute; right:6px; top:6px; border:0; background:none; color:var(--ink-3); font-size:18px; line-height:1; padding:4px 6px; }

/* week grid */
.grid5{ display:grid; grid-template-columns:repeat(7,minmax(0,28px)); gap:6px; }
.grid5 .wd{ font-size:11px; color:var(--ink-3); text-align:center; font-family:var(--f-mono); }
.cell{ aspect-ratio:1; max-width:100%; border-radius:4px; border:1px solid var(--line); background:transparent; position:relative; }
.cell.std{ background:var(--blue); border-color:var(--blue); }
.cell.min{ background:linear-gradient(135deg,var(--blue) 0 50%,transparent 50%); border-color:var(--blue); }
.cell.part{ border:2px solid var(--blue); }
.cell.skip{ background:repeating-linear-gradient(135deg,var(--ink-3) 0 1.5px,transparent 1.5px 6px); border-color:var(--ink-3); }
.cell.none{ border-style:dashed; }
.cell.future{ opacity:.35; border-style:dotted; }
.cell.today{ box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--red); }
.legend{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11.5px; color:var(--ink-3); }
.legend i{ display:inline-block; width:11px; height:11px; vertical-align:-1px; margin-right:4px; border-radius:2px; border:1px solid var(--line); }
.legend i.std{ background:var(--blue); border-color:var(--blue); }
.legend i.min{ background:linear-gradient(135deg,var(--blue) 0 50%,transparent 50%); border-color:var(--blue); }
.legend i.part{ border:2px solid var(--blue); }
.legend i.skip{ background:repeating-linear-gradient(135deg,var(--ink-3) 0 1.5px,transparent 1.5px 4px); border-color:var(--ink-3); }
.legend i.none{ border-style:dashed; }
.figs{ display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13.5px; color:var(--ink-2); }
.figs b{ font-family:var(--f-mono); color:var(--ink); font-weight:500; font-size:16px; margin:0 2px; }
.figs .redb b{ color:var(--red); }
.note{ font-size:13px; color:var(--ink-2); border-top:1px dashed var(--line); padding-top:8px; margin:0; }

/* captures */
.cap{ border:1px solid var(--line); border-radius:10px; background:var(--card); padding:12px 14px; display:flex; flex-direction:column; gap:6px; min-width:0; }
.cap.fresh{ border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft); }
.cap-top{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-3); }
.cap-top .mono{ color:var(--ink); font-size:13px; }
.emo{ display:inline-flex; align-items:center; gap:6px; color:var(--ink); font-size:13px; font-weight:600; }
.bars{ display:inline-flex; gap:2px; }
.bars i{ width:5px; height:11px; border-radius:1px; background:var(--line); display:block; }
.bars i.on{ background:var(--red); }
.quote{ font-family:var(--f-display); font-size:17px; font-weight:600; line-height:1.5; margin:2px 0; overflow-wrap:anywhere; }
.quote::before{ content:"「"; color:var(--ink-3); } .quote::after{ content:"」"; color:var(--ink-3); }
.kv{ display:grid; grid-template-columns:4.6em 1fr; gap:2px 8px; font-size:14px; }
.kv dt{ color:var(--ink-3); } .kv dd{ margin:0; overflow-wrap:anywhere; min-width:0; }
.care{ font-size:14px; border-top:1px dashed var(--line); padding-top:6px; }
.care b{ color:var(--blue); font-weight:600; }
.pending{ font-size:12px; color:var(--red); }
.tagline{ display:flex; gap:6px; flex-wrap:wrap; }
.tg{ font-size:11.5px; border:1px solid var(--line); border-radius:4px; padding:0 6px; color:var(--ink-2); }
.capmini{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:14px; }
.capmini li{ display:flex; gap:8px; min-width:0; }
.capmini .mono{ color:var(--ink-3); font-size:12.5px; flex:none; padding-top:2px; }
.capmini span.txt{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.capmini .linkbtn{ min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; }
.capmini .pending{ flex:none; padding-top:2px; }
.cool{ border-color:var(--blue); background:var(--blue-soft); }
.hno{ font-family:var(--f-mono); font-size:12px; font-weight:600; color:var(--blue); border:1px solid var(--blue); border-radius:4px; padding:0 5px; line-height:1.6; flex:none; white-space:nowrap; }
.pins{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
.pins li{ display:flex; gap:10px; align-items:flex-start; min-width:0; }
.pin-b,.pv-b{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.pin-t{ font-size:15px; line-height:1.55; overflow-wrap:anywhere; }
.hmeta b{ font-weight:500; color:var(--ink); }
.hmeta .c, .hmeta .c b{ color:var(--red); }
.old{ text-decoration:line-through; text-decoration-color:var(--red); color:var(--ink-3); overflow-wrap:anywhere; }
.arc{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; min-width:0; }
.arc-head{ font-family:var(--f-display); font-size:18px; font-weight:700; line-height:1.5; text-wrap:balance; overflow-wrap:anywhere; }
.arc-pts{ margin:0; padding-left:1.2em; display:flex; flex-direction:column; gap:4px; font-size:14px; color:var(--ink-2); }
.arc-pts li{ overflow-wrap:anywhere; }
.arc-sec{ font-weight:700; font-size:14px; border-top:1px solid var(--line); padding-top:10px; margin-top:2px; }
.arc-h{ display:flex; flex-direction:column; gap:6px; }
.arc-moment{ margin:0; font-size:14px; }
.arc-mini{ margin:0; font-weight:600; overflow-wrap:anywhere; }
.tl{ margin:0; padding-left:1.5em; display:flex; flex-direction:column; gap:6px; font-size:14px; }
.tl li, .gaps li{ overflow-wrap:anywhere; }
.gaps{ margin:0; padding-left:1.2em; font-size:13.5px; color:var(--ink-2); }
.kv.nx{ grid-template-columns:1fr; gap:2px; }
.kv.nx dd{ margin-bottom:6px; }
.qs{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; font-size:14px; }
.qs li{ display:flex; gap:8px; align-items:flex-start; min-width:0; }
.qs li > span{ min-width:0; overflow-wrap:anywhere; }
.qs li.done > span{ text-decoration:line-through; color:var(--ink-3); }
.qbtn{ flex:none; width:24px; height:24px; border-radius:5px; border:1px solid var(--line); background:var(--card); font-size:12px; line-height:1; padding:0; color:var(--ink-3); }
.qs li.done .qbtn{ background:var(--green-soft); border-color:var(--green); color:var(--green); }
details.cv, details.hist, details.drafts{ font-size:13.5px; color:var(--ink-2); }
details summary{ cursor:pointer; }
details.cv{ border:1px dashed var(--line); border-radius:8px; padding:8px 12px; }
details.cv ul, details.drafts ul, details.hist ol{ margin:8px 0 0; padding-left:1.2em; display:flex; flex-direction:column; gap:6px; }
.strg{ font-size:11px; border-radius:3px; padding:0 4px; margin:0 5px; }
.strg.strong{ background:var(--blue-soft); color:var(--blue); }
.strg.weak{ color:var(--ink-3); border:1px solid var(--line); }
.errbox{ border:1px solid var(--red); background:var(--red-soft); border-radius:8px; padding:10px 12px; font-size:14px; display:flex; flex-direction:column; gap:4px; }
.errbox p{ margin:0; overflow-wrap:anywhere; }
.errbox b{ color:var(--red); }
.pv{ gap:10px; }
.pv-row{ display:flex; gap:8px; align-items:flex-start; font-size:14px; }
.mono-in{ font-family:var(--f-mono); }
.pen.half{ color:var(--ink-2); }
.evt-title{ font-weight:700; font-size:16px; line-height:1.45; overflow-wrap:anywhere; }
.evt .kv{ grid-template-columns:5.2em 1fr; }

/* hypotheses: index cards */
.hyp{ background:var(--card); border:1px solid var(--line); border-radius:6px; padding:14px 16px 12px; display:flex; flex-direction:column; gap:8px; background-image:linear-gradient(var(--card) 30px,transparent 30px),repeating-linear-gradient(transparent 0 25px,var(--grid) 25px 26px); min-width:0; }
.hyp.solid{ border-color:var(--green); }
.hyp.revised .hs{ text-decoration:line-through; text-decoration-color:var(--red); text-decoration-thickness:1.5px; color:var(--ink-3); }
.hyp.example{ opacity:.7; border-style:dashed; }
.hs{ font-size:16px; line-height:1.55; overflow-wrap:anywhere; }
.hs .pre{ color:var(--ink-3); font-size:13.5px; margin-right:4px; }
.hmeta{ display:flex; flex-wrap:wrap; gap:4px 16px; align-items:center; font-size:12.5px; color:var(--ink-3); }
.tally{ display:inline-flex; align-items:center; gap:5px; color:var(--ink-2); }
.tally svg{ display:block; }
.tally.con{ color:var(--red); }
.st{ font-size:11.5px; border-radius:4px; padding:1px 7px; font-weight:600; }
.st.test{ background:var(--blue-soft); color:var(--blue); }
.st.solid{ background:var(--green-soft); color:var(--green); }
.st.revised{ background:var(--red-soft); color:var(--red); }
.evs{ list-style:none; margin:0; padding:0; font-size:13px; color:var(--ink-2); display:flex; flex-direction:column; gap:2px; }
.evs .c{ color:var(--red); }
.suggest{ font-size:13px; color:var(--green); }
.suggest.r{ color:var(--red); }
.inline{ border-top:1px dashed var(--line); padding-top:10px; display:flex; flex-direction:column; gap:8px; }

/* banners */
.banner{ border-color:var(--red); }
.banner .stage{ color:var(--red); }
.fuse{ border-color:var(--red); background:var(--red-soft); }
.copybox textarea{ min-height:180px; font-family:var(--f-mono); font-size:12.5px; }

/* log */
.logrow{ display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:8px; width:100%; text-align:left; }
.logrow .cell{ width:16px; flex:none; }
.logrow .d{ font-family:var(--f-mono); font-size:13.5px; flex:none; width:6.5em; }
.logrow .s{ font-size:13px; color:var(--ink-2); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
.detail{ border-left:2px solid var(--line); margin:4px 0 8px 8px; padding:4px 0 4px 14px; display:flex; flex-direction:column; gap:10px; }

/* tabs */
.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--card); border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px)); padding-right:max(8px,env(safe-area-inset-right,0px)); padding-bottom:env(safe-area-inset-bottom,0px); }
.tabs .in{ max-width:600px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); }
.tabs a{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 2px 9px; text-decoration:none; color:var(--ink-3); font-size:12px; }
.tabs a svg{ width:22px; height:22px; }
.tabs a.on{ color:var(--blue); font-weight:600; }
.tabs a.cap-tab .dot{ width:38px; height:38px; margin-top:-16px; border-radius:50%; background:var(--blue); color:var(--on-blue); display:grid; place-items:center; box-shadow:0 0 0 4px var(--card); }
.tabs a.cap-tab .dot svg{ width:20px; height:20px; }
#toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--paper); padding:8px 14px; border-radius:8px; font-size:14px; z-index:9; max-width:calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference){ .cap.fresh{ transition:box-shadow .6s; } }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">自我观察本</div>
    <div class="sync" id="sync">连接中</div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="页面">
  <div class="in">

<script>
(() => {
'use strict';
/* ---------- constants ---------- */
const KINDS = { avoid:'最可能拖着不做的事', emotion:'最可能让我情绪起伏的', specific:'具体预测' };
const SRC = { morning:'早上写', late:'补写', eve:'前晚出题' };
const RES = { hit:'对', miss:'落空', half:'一半' };
const EMOS = ['焦虑','烦躁','委屈','失落','羞愧','愤怒','紧张','无力','不耐烦','兴奋','被认可','平静'];
const BODY = ['胸闷','肩颈紧','心跳快','胃里发紧','脸发热','坐不住','想逃开','没力气','呼吸浅','放松'];
const TAGS = ['预测落空','不像自己','拖延','冲突','纠结','高光'];
const SKIPR = ['太累','忘了','不想面对','没时间','其他'];
const VAGUE = ['充实','好好','努力','认真','尽量','高效','顺利','不错','加油','开心','积极','争取','适当','多一点','少一点','状态好'];
const MOMENTS = ['情绪最强的一刻','最不像自己的一刻','最有劲的一刻','别的时刻'];
const FORMAT = 'review-archive/v1';
const OFFLINE_APP = true;
const APP_VERSION = 'v4';
const LS_KEY = 'zwgcb-data-v1', LS_DRAFT = 'zwgcb-drafts-v1';

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = k => { const a = k.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const dayKey = (d = new Date()) => ymd(new Date(d.getTime() - 4 * 3600e3));
const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return ymd(d); };
const weekStart = k => { const d = parse(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
const hm = iso => { const d = new Date(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const md = k => { const p = k.split('-'); return (+p[1]) + '月' + (+p[2]) + '日'; };
const mdShort = k => { const p = k.split('-'); return p[1] + '·' + p[2]; };
const wdOf = k => '周' + '日一二三四五六'[parse(k).getDay()];
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const newDay = k => ({ date:k, preds:[], caps:[], evening:null, skip:null });
const getDay = k => clone(S.days[k]) || newDay(k);
const sitOf = h => String(h.sit || '').trim().replace(/(的时候|时候|时)$/, '');
const reaOf = h => String(h.rea || '').trim().replace(/^(我可能会|可能会)/, '');
const composeHyp = (sit, rea) => '在' + sitOf({ sit }) + '时，我可能会' + reaOf({ rea });
const hypText = h => (h && h.text && String(h.text).trim()) || composeHyp(h && h.sit, h && h.rea);
const validDate = d => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d) && ymd(parse(d)) === d;
const trunc = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; };
function setPath(o, path, v){ const ps = path.split('.'); let c = o; for (let i = 0; i < ps.length - 1; i++){ if (c[ps[i]] == null || typeof c[ps[i]] !== 'object') c[ps[i]] = {}; c = c[ps[i]]; } c[ps[ps.length - 1]] = v; }
function getPath(o, path){ return path.split('.').reduce((c, p) => c == null ? undefined : c[p], o); }
let toastT = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }
function errMsg(e){
  const c = e && e.code;
  if (c === 'quota_exceeded') return '存储空间满了，先在「记录」里导出一份备份。';
  if (c === 'revoked' || c === 'not_granted') return '这个页面暂时不能保存了，刷新试试。';
  if (c === 'invalid_argument') return '这次没存上：当前身份没有写入权限。';
  return '这次没存上，网络恢复后再点一次保存。';
}

/* ---------- state ---------- */
let S = { days:{}, hyps:{}, weeks:{}, events:{}, archives:{}, meta:{} };
const COLS = ['days','hyps','weeks','events','archives','meta'];
let mode = 'init';           // init | cloud | local
let ready = false, slow = false, migrated = false;
let route = 'today';
let form = null;             // {type, key, data, dirty}
let ui = { skipOpen:false, logOpen:null, hypOpen:null, hypNew:false, copy:null, fresh:null, weekKey:null, arcDel:null };
let drafts = {};
try { drafts = JSON.parse(localStorage.getItem(LS_DRAFT) || '{}') || {}; } catch (e) { drafts = {}; }
let dlNs = null;

/* ---------- storage ---------- */
let base = null;
const queues = {};
function lsWrite(){ try { const o = { savedAt:Date.now() }; COLS.forEach(c => { o[c] = S[c]; }); localStorage.setItem(LS_KEY, JSON.stringify(o)); return true; } catch (e) { return false; } }
function lsRead(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } }
function put(col, id, data){
  S[col] = Object.assign({}, S[col]); S[col][id] = data;
  if (mode === 'cloud'){
    const path = col + '/' + id;
    const p = (queues[path] || Promise.resolve()).catch(() => {}).then(() => base.collection(col).doc(id).set(data));
    queues[path] = p;
    return p.catch(e => { toast(errMsg(e)); throw e; });
  }
  if (!lsWrite()) toast('这个浏览器不允许保存，刷新后会丢失。');
  return Promise.resolve();
}
function remove(col, id){
  S[col] = Object.assign({}, S[col]); delete S[col][id];
  if (mode === 'cloud'){
    const path = col + '/' + id;
    const p = (queues[path] || Promise.resolve()).catch(() => {}).then(() => base.collection(col).doc(id).delete());
    queues[path] = p;
    return p.catch(e => { toast(errMsg(e)); throw e; });
  }
  lsWrite(); return Promise.resolve();
}
function saveDrafts(){ try { localStorage.setItem(LS_DRAFT, JSON.stringify(drafts)); } catch (e) {} }
let draftT = null;
function draftLater(){ clearTimeout(draftT); draftT = setTimeout(saveDrafts, 400); }

function useLocal(){
  if (mode === 'cloud') return;
  mode = 'local';
  const l = lsRead();
  if (l){ const n = {}; COLS.forEach(c => { n[c] = (l[c] && typeof l[c] === 'object') ? l[c] : {}; }); S = n; }
  ready = true; refresh(); migrateHyps();
}
function startCloud(db, uid){
  mode = 'cloud';
  base = db.doc('data/users/' + uid + '/main');
  const loaded = {}, definite = {};
  const slowT = setTimeout(() => { if (!COLS.every(c => definite[c])){ slow = true; syncLabel(); } }, 10000);
  const done = () => {
    if (COLS.every(c => loaded[c]) && !ready){ ready = true; }
    if (COLS.every(c => definite[c])){ clearTimeout(slowT); slow = false; migrate().then(() => migrateHyps()); }
    refresh();
  };
  const sub = (col, q) => q.onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); });
    S[col] = o; loaded[col] = true; if (!snap.metadata.fromCache) definite[col] = true; done();
  }, err => { clearTimeout(slowT); slow = true; loaded[col] = true; definite[col] = true; toast(errMsg(err)); done(); });
  sub('days', base.collection('days').orderBy('date', 'desc').limit(600));
  sub('hyps', base.collection('hyps'));
  sub('weeks', base.collection('weeks'));
  sub('events', base.collection('events'));
  sub('archives', base.collection('archives'));
  sub('meta', base.collection('meta'));
}
async function migrate(){
  if (migrated) return; migrated = true;
  const l = lsRead(); if (!l) return;
  let n = 0;
  for (const col of COLS){
    for (const id of Object.keys(l[col] || {})){
      if (!S[col][id]){ try { await put(col, id, l[col][id]); n++; } catch (e) { return; } }
    }
  }
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  if (n) toast('这台设备上之前的 ' + n + ' 条记录已同步。');
}
function refresh(){
  syncLabel();
  if (!form || !form.dirty){ if (!ui.hypOpen && !ui.hypNew) render(); }
}
function syncLabel(){
  const el = $('#sync');
  let t = '连接中', w = false;
  if (mode === 'cloud') { t = !ready ? '载入中' : slow ? '连接慢，可能不是最新' : '已同步 · 仅自己可见'; w = slow; }
  else if (mode === 'local') { t = OFFLINE_APP ? '离线可用 · 存在这部手机' : '只存在这台设备'; w = !OFFLINE_APP; }
  el.textContent = t; el.classList.toggle('warn', w);
}
function saveFile(filename, data){
  const type = /\.docx$/.test(filename) ? 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' : 'application/json';
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  const download = () => {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
    return { status:'saved' };
  };
  let file = null; try { file = new File([blob], filename, { type }); } catch (e) {}
  const touch = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  let shareable = false;
  if (touch && file && navigator.share && navigator.canShare){ try { shareable = navigator.canShare({ files:[file] }); } catch (e) {} }
  if (shareable){
    return navigator.share({ files:[file], title:filename }).then(() => ({ status:'saved' }), err => {
      if (err && err.name === 'AbortError') throw { code:'declined' };
      return download();
    });
  }
  return Promise.resolve(download());
}
async function init(){
  dlNs = { save:({ filename, data }) => saveFile(filename, data) };
  useLocal();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  try { if (sessionStorage.getItem('zwgcb-updated')){ sessionStorage.removeItem('zwgcb-updated'); setTimeout(() => toast('已更新到新版本 ' + APP_VERSION + '。'), 400); } } catch (e) {}
}

/* ---------- derived ---------- */
function dayStatus(k, t){
  if (k > t) return 'future';
  const d = S.days[k], evs = eventsOn(k).length + archivesOn(k).length; if (!d) return evs ? 'part' : 'none';
  if (d.evening) return d.evening.mode === 'std' ? 'std' : 'min';
  if (d.skip) return 'skip';
  if ((d.preds && d.preds.length) || (d.caps && d.caps.length) || evs) return 'part';
  return 'none';
}
function firstDay(){
  let f = null;
  for (const k in S.days){ const d = S.days[k]; if ((d.preds && d.preds.some(p => p.src !== 'eve')) || (d.caps && d.caps.length) || d.evening || d.skip){ if (!f || k < f) f = k; } }
  return f;
}
const evCount = (h, kind) => (h.ev || []).filter(e => e.kind === kind).length;
function weekData(ws){
  const we = addDays(ws, 6), t = dayKey();
  const r = { ws, we, days:[], misses:[], surprises:[], skips:{}, emos:{}, tags:{}, capN:0, intSum:0, intN:0, preds:0, late:0, rec:0, newHyps:[], sup:0, con:0, revised:[], newInfo:0, heavy:0 };
  for (let i = 0; i < 7; i++){
    const k = addDays(ws, i), st = dayStatus(k, t), d = S.days[k];
    r.days.push({ k, st });
    if (st === 'std' || st === 'min') r.rec++;
    if (!d) continue;
    (d.preds || []).forEach(p => { if (k > t) return; r.preds++; if (p.src === 'late') r.late++; if (p.result === 'miss' || p.result === 'half') r.misses.push(Object.assign({ k }, p)); });
    (d.caps || []).forEach(c => { r.capN++; (c.emos || []).forEach(e => { r.emos[e] = (r.emos[e] || 0) + 1; }); if (c.inten){ r.intSum += c.inten; r.intN++; } (c.tags || []).forEach(g => { r.tags[g] = (r.tags[g] || 0) + 1; }); });
    if (d.skip) r.skips[d.skip.reason] = (r.skips[d.skip.reason] || 0) + 1;
    if (d.evening && d.evening.surprise) r.surprises.push({ k, text:d.evening.surprise });
    if (d.evening && d.evening.after === 'heavy') r.heavy++;
  }
  Object.values(S.hyps).forEach(h => {
    if (h.created >= ws && h.created <= we) r.newHyps.push(h);
    (h.ev || []).forEach(e => { if (e.date >= ws && e.date <= we){ if (e.kind === 'sup') r.sup++; else r.con++; } });
    (h.history || []).forEach(v => { if (v.to >= ws && v.to <= we) r.revised.push(h); });
  });
  r.evs = Object.values(S.events).filter(e => e.date >= ws && e.date <= we).sort((a, b) => a.date.localeCompare(b.date));
  r.arcs = Object.values(S.archives || {}).filter(a => a.date >= ws && a.date <= we).sort((a, b) => a.date.localeCompare(b.date));
  r.evs.forEach(e => { if (e.gap) r.surprises.push({ k:e.date, text:(e.title ? e.title + '：' : '') + e.gap, label:'单件复盘 · 事后回想的预期' }); });
  r.newInfo = r.misses.length + r.surprises.length + (r.tags['不像自己'] || 0) + r.con + r.revised.length;
  return r;
}
function lastRevision(){ let l = null; Object.values(S.hyps).forEach(h => { if (h.revisedOn && (!l || h.revisedOn > l)) l = h.revisedOn; }); return l; }
function fuseOn(){
  const t = dayKey();
  const ev = Object.values(S.days).filter(d => d.evening && d.evening.after && d.date >= addDays(t, -6)).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
  return ev.length === 3 && ev.every(d => d.evening.after === 'heavy');
}
const openHyps = () => Object.values(S.hyps).filter(h => h.status !== 'revised').sort((a, b) => (b.updated || '').localeCompare(a.updated || ''));
const eventsOn = k => Object.values(S.events || {}).filter(e => e.date === k).sort((a, b) => (a.created || '').localeCompare(b.created || ''));
const eventForCap = (k, id) => Object.values(S.events || {}).find(e => e.capRef === k + '|' + id);
const archivesOn = k => Object.values(S.archives || {}).filter(r => r.date === k).sort((a, b) => String(a.imported || '').localeCompare(String(b.imported || '')));
const allDayKeys = () => Array.from(new Set(Object.keys(S.days).concat(Object.values(S.events || {}).map(e => e.date), Object.values(S.archives || {}).map(r => r.date))));
function capByRef(ref){
  if (!ref) return null;
  const p = ref.split('|'), d = S.days[p[0]], c = d && (d.caps || []).find(x => x.id === p[1]);
  return c ? { k:p[0], c } : null;
}
function prefillFromCap(data, k, id){
  const r = capByRef(k + '|' + id); if (!r) return;
  const c = r.c;
  data.capRef = k + '|' + id; data.date = k;
  if (!data.title) data.title = (c.fact || c.quote || '').slice(0, 40);
  if (!data.facts) data.facts = [c.fact, c.did && '我做了：' + c.did, c.wanted && '想做没做：' + c.wanted].filter(Boolean).join('\n');
  if (!data.quote) data.quote = c.quote || '';
  if (!(data.emos || []).length) data.emos = (c.emos || []).slice();
  if (!data.inten) data.inten = c.inten || 0;
  if (!(data.body || []).length) data.body = (c.body || []).slice();
  if (!data.care) data.care = c.care || '';
}

/* ---------- hypotheses: fixed numbers, history, evidence strength ---------- */
const hypNo = h => (h && h.no) ? 'H' + h.no : 'H?';
function maxNo(hs){ let m = 0; Object.values(hs || {}).forEach(h => { if (h && h.no > m) m = h.no; }); return m; }
const curSeq = () => (S.meta && S.meta.counters && S.meta.counters.hypSeq) || 0;
const nextNo = () => Math.max(curSeq(), maxNo(S.hyps)) + 1;
function claimNo(){ const n = nextNo(); put('meta', 'counters', { hypSeq:n }).catch(() => {}); return n; }
function makeHyp(o){
  return { id:newId(), no:o.no || claimNo(), text:o.text || composeHyp(o.sit, o.rea), sit:o.sit || null, rea:o.rea || null, created:o.date || dayKey(), updated:new Date().toISOString(), status:'test', ev:o.ev || [], history:[], revisedOn:null, origin:o.origin || 'app', verBy:null };
}
function pushHistory(h, date){
  h.history = (h.history || []).concat([{ text:hypText(h), sit:h.sit || null, rea:h.rea || null, ev:h.ev || [], from:h.revisedOn || h.created, to:date, by:h.verBy || null, prevRevisedOn:h.revisedOn || null }]);
}
function evStats(ev){ const r = { sup:0, con:0, supW:0, conW:0 }; (ev || []).forEach(e => { if (e.kind === 'con'){ r.con++; if (e.str === 'weak') r.conW++; } else { r.sup++; if (e.str === 'weak') r.supW++; } }); return r; }
const evLi = e => '<li class="' + (e.kind === 'con' ? 'c' : '') + '"><span class="mono">' + (e.date ? mdShort(e.date) : '') + '</span> ' + (e.kind === 'con' ? '反例' : '支持') + '<span class="strg ' + (e.str === 'weak' ? 'weak' : 'strong') + '">' + (e.str === 'weak' ? '弱' : '强') + '</span>' + (e.note ? esc(e.note) : '') + '</li>';
const strSeg = () => '<div class="f"><div class="lab">证据强度</div>' + segHTML('D.str', [['strong','强 · 当时记下或预测过'],['weak','弱 · 事后回想']]) + '</div>';
let hypsMigrated = false;
async function migrateHyps(){
  if (hypsMigrated || !ready) return;
  hypsMigrated = true;
  const hs = clone(S.hyps) || {}, puts = {}, dels = new Set();
  // fold the old "revised → new copy" chains into one numbered hypothesis with history
  Object.values(hs).forEach(h => {
    if (h.status === 'revised' || !h.parent || !hs[h.parent]) return;
    const hist = []; let p = hs[h.parent], guard = 0;
    while (p && guard++ < 50){ hist.unshift({ text:hypText(p), sit:p.sit || null, rea:p.rea || null, ev:p.ev || [], from:p.created, to:p.revisedOn || h.created, by:null, prevRevisedOn:null }); dels.add(p.id); p = p.parent ? hs[p.parent] : null; }
    h.history = hist.concat(Array.isArray(h.history) ? h.history : []); h.revisedOn = h.revisedOn || h.created; h.parent = null; puts[h.id] = h;
  });
  Object.values(hs).forEach(h => { if (h.status === 'revised' && !dels.has(h.id)){ h.status = 'test'; h.child = null; puts[h.id] = h; } });
  dels.forEach(id => { delete hs[id]; delete puts[id]; });
  let n = Math.max(curSeq(), maxNo(hs));
  const seen = new Set();
  Object.values(hs).sort((a, b) => String(a.created || '').localeCompare(String(b.created || '')) || String(a.id).localeCompare(String(b.id))).forEach(h => {
    if (!h.text){ h.text = composeHyp(h.sit, h.rea); puts[h.id] = h; }
    if (!Array.isArray(h.history)){ h.history = []; puts[h.id] = h; }
    if (!h.no || seen.has(h.no)){ h.no = ++n; puts[h.id] = h; }
    seen.add(h.no);
  });
  const ids = Object.keys(puts);
  if (!ids.length && !dels.size && n <= curSeq()) return;
  try {
    await Promise.all(ids.map(id => put('hyps', id, puts[id])).concat(Array.from(dels).map(id => remove('hyps', id))));
    if (n > curSeq()) await put('meta', 'counters', { hypSeq:n });
  } catch (e) { hypsMigrated = false; }
  refresh();
}
function capEvidenceOps(k, c, old){
  const src = 'cap:' + k + '|' + c.id, ids = new Set([old && old.hyp, c.hyp].filter(Boolean)), ops = [];
  ids.forEach(hid => {
    if (!S.hyps[hid]) return;
    const h = clone(S.hyps[hid]), before = JSON.stringify(h.ev || []);
    h.ev = (h.ev || []).filter(e => e.src !== src);
    if (c.hyp === hid) h.ev.push({ date:k, kind:c.hypKind === 'con' ? 'con' : 'sup', note:c.fact || c.quote || '随手记', str:'strong', src });
    if (JSON.stringify(h.ev) !== before){ h.updated = new Date().toISOString(); ops.push(() => put('hyps', hid, h)); }
  });
  return ops;
}
function backupLine(){
  if (!OFFLINE_APP || Object.keys(S.days).length < 3) return '';
  let lb = null; try { lb = localStorage.getItem('zwgcb-lastbackup'); } catch (e) {}
  if (!lb) return '<p class="warn" style="margin:0">记录只存在这部手机里，还没做过全部数据导出。去「记录」页导出一份。</p>';
  const n = Math.round((parse(dayKey()) - parse(lb)) / 864e5);
  return n >= 7 ? '<p class="warn" style="margin:0">上次全部数据导出是 ' + n + ' 天前，去「记录」页再导一份。</p>' : '';
}

/* ---------- review-archive/v1: extract, validate, plan, revert ---------- */
function matchBrace(s, i){
  let depth = 0, inStr = false, bs = false;

    if (type === 'import') data = { text:'', a:null, err:null, mode:null, tmr:true };

      if (S.events[key]) data = clone(S.events[key]);

    let blob; try { blob = buildDocx(eventDocXml(ev)); } catch (e){ toast('生成 Word 时出错了，先用「复制给 Claude」把文字留下来。'); return; }
    const part = String(ev.title || '').replace(/[\\\/:*?"<>|\s]+/g, '').slice(0, 14);
    try { await dlNs.save({ filename:'单件复盘-' + ev.date + (part ? '-' + part : '') + '.docx', data:blob }); toast('Word 保存好了。'); }
    catch (e){ if (e && e.code === 'declined') return; toast('没保存成功，可以先用「复制给 Claude」把文字留下来。'); }
  },
  copyEvent(el){ const ev = S.events[el.dataset.id]; if (ev) copyText(eventText(ev) + '\n\n' + hypListText() + '\n\n' + EVENT_OPENER + '\n' + ARCHIVE_TAIL); },
  async wordDay(el){
    if (!dlNs){ toast('这里不能保存文件，可以先用「复制给 Claude」把文字留下来。'); return; }
    const k = el.dataset.key;
    let blob;
    try { blob = buildDocx(dayDocXml(k)); } catch (e){ toast('生成 Word 时出错了，先用「复制给 Claude」把文字留下来。'); return; }
    try { await dlNs.save({ filename:'复盘-' + k + '.docx', data:blob }); toast('Word 保存好了。'); }
    catch (e){
      if (e && e.code === 'declined') return;
      if (e && e.code === 'rate_limited') toast('上一个保存窗口还开着，处理完再点一次。');
      else toast('没保存成功，可以先用「复制给 Claude」把文字留下来。');
    }
  },
  async export(){
    if (!dlNs){ toast('这里不能导出文件，用「复制全部为文字」。'); return; }
    const o = { app:'自我观察本', exportedAt:new Date().toISOString() }; COLS.forEach(c => { o[c] = S[c]; });
    try { await dlNs.save({ filename:'自我观察本-全部数据-' + dayKey() + '.json', data:JSON.stringify(o, null, 2) }); try { localStorage.setItem('zwgcb-lastbackup', dayKey()); } catch (e2) {} toast('全部数据导出好了。'); render(); }
    catch (e){ if (!e || e.code !== 'declined') toast('导出没成功，可以先用「复制全部为文字」。'); }
  },
  importPick(){ const i = $('#importFile'); if (i){ i.value = ''; i.click(); } },
  impOpen(){ openForm('import', 'new'); },
  impParse(){
    const x = form.data, ta = $('#f-text'); if (ta) x.text = ta.value;
    const r = extractArchive(x.text);
    if (r.error){ x.err = [r.error]; x.a = null; render(); return; }
    const errs = validateArchive(r.obj);
    if (errs.length){ x.err = errs; x.a = null; render(); return; }
    x.err = null; x.a = r.obj; x.mode = archivesOn(r.obj.date).length ? null : 'add'; x.tmr = true;
    drafts[form.type + ':' + form.key] = x; draftLater(); render(); window.scrollTo(0, 0);
  },
  impBack(){ form.data.a = null; form.data.err = null; render(); },
  impMode(el){ form.data.mode = el.dataset.v; render(); },
  impTmr(){ form.data.tmr = !form.data.tmr; render(); },
  async impCommit(){
    if (!needReady() || !form || !form.data.a) return;
    const x = form.data, a = x.a, same = archivesOn(a.date);
    if (same.length && !x.mode){ toast('先选「覆盖」还是「另存一条」。'); return; }
    const ow = (x.mode && x.mode !== 'add') ? S.archives[x.mode] : null;
    const p = planArchive(a, ow);
    if (p.errors.length){ render(); return; }
    const now = new Date().toISOString();
    const rec = { id:p.recId, date:a.date, time:a.time || '', chat_link:a.chat_link || '', imported:now, data:a, applied:p.items, tmrPredId:null, resolvedQ:[] };
    const tp = String(a.tomorrow_prediction || '').trim();
    if (tp && x.tmr){ const nk = addDays(a.date, 1), nd = p.days[nk] || getDay(nk); rec.tmrPredId = newId(); nd.preds = (nd.preds || []).concat([{ id:rec.tmrPredId, kind:'specific', text:tp, hid:null, at:now, src:'eve', result:'', actual:'', arc:rec.id }]); p.days[nk] = nd; }
    const ops = [];
    p.putIds.forEach(id => ops.push(put('hyps', id, p.hs[id])));
    p.delIds.forEach(id => ops.push(remove('hyps', id)));
    Object.keys(p.days).forEach(k => ops.push(put('days', k, p.days[k])));
    if (p.seq > curSeq()) ops.push(put('meta', 'counters', { hypSeq:p.seq }));
    ops.push(put('archives', rec.id, rec));
    if (ow) ops.push(remove('archives', ow.id));
    closeForm(); ui.logOpen = a.date;
    if (location.hash === '#log'){ route = 'log'; render(); } else location.hash = '#log';
    window.scrollTo(0, 0);
    try { await Promise.all(ops); toast('导入好了，归到 ' + md(a.date) + (p.items.length ? '，假设清单变了 ' + p.items.length + ' 处' : '') + '。'); } catch (e) {}
  },
  openDay(el){ ui.logOpen = el.dataset.key; if (location.hash === '#log'){ form = null; route = 'log'; render(); } else location.hash = '#log'; },
  async qToggle(el){ if (!needReady()) return; const r = clone(S.archives[el.dataset.id]); if (!r) return; const i = +el.dataset.v, set = new Set(r.resolvedQ || []); if (set.has(i)) set.delete(i); else set.add(i); r.resolvedQ = Array.from(set).sort((a, b) => a - b); const p = put('archives', r.id, r); render(); try { await p; } catch (e) {} },
  arcDelAsk(el){ ui.arcDel = el.dataset.id; render(); },
  arcDelNo(){ ui.arcDel = null; render(); },
  async arcDel(el){
    if (!needReady()) return;
    const rec = S.archives[el.dataset.id]; if (!rec) return;
    const hs = clone(S.hyps) || {}, days = {};
    revertInto(rec, hs, days);
    const d = hypDiff(hs), ops = [];
    d.putIds.forEach(id => ops.push(put('hyps', id, hs[id]))); d.delIds.forEach(id => ops.push(remove('hyps', id)));
    Object.keys(days).forEach(k => ops.push(put('days', k, days[k])));
    ops.push(remove('archives', rec.id));
    ui.arcDel = null; render();
    try { await Promise.all(ops); toast('删掉了这份存档，它加的证据和假设也撤回了。'); } catch (e) {}
  }
};
function applyResults(d, R){ d.preds = d.preds.map(p => { const r = R && R[p.id]; return r ? Object.assign({}, p, { result:r.r || '', actual:(r.a || '').trim() }) : p; }); }
function applyD(k, D, writes){
  if (!D || D.op === 'none') return { op:'none' };
  const now = new Date().toISOString();
  if (D.op === 'new'){
    const sit = (D.sit || '').trim(), rea = (D.rea || '').trim();
    if (!sit && !rea) return { op:'none' };
    const h = makeHyp({ sit:sit || '（情境没写）', rea:rea || '（反应没写）', date:k, ev:[{ date:k, kind:'sup', note:(D.ev || '').trim(), str:D.str === 'weak' ? 'weak' : 'strong' }] });
    writes.push(() => put('hyps', h.id, h));
    return { op:'new', hid:h.id, text:hypNo(h) + ' ' + hypText(h), line:'<div class="hmeta"><span class="hno">' + hypNo(h) + '</span></div>' +'<div class="hmeta"><span class="st test">新假设</span></div>' + hypLines(h) };
  }
  if (D.op === 'old' && D.hid && S.hyps[D.hid]){
    const h = clone(S.hyps[D.hid]), kind = D.kind === 'con' ? 'con' : 'sup';
    h.ev = (h.ev || []).concat([{ date:k, kind, note:(D.ev || '').trim(), str:D.str === 'weak' ? 'weak' : 'strong' }]); h.updated = now;
    writes.push(() => put('hyps', h.id, h));
    return { op:'old', hid:h.id, kind, text:hypNo(h) + ' ' + hypText(h) + '（' + (kind === 'con' ? '反例' : '支持') + '）', line:'<div class="hmeta"><span class="st ' + (kind === 'con' ? 'revised' : 'test') + '">' + (kind === 'con' ? '记了一次反例' : '记了一次支持') + '</span></div>' + hypLines(h) };
  }
  return { op:'none' };
}
function applyE(k, E, prevE, writes){
  E = E || {};
  const out = { watch:(E.watch || '').trim(), tmr:(E.tmr || '').trim(), predId:prevE ? prevE.predId : null };
  const nk = addDays(k, 1);
  if (out.tmr || out.predId){
    const nd = getDay(nk);
    if (out.predId && nd.preds.some(p => p.id === out.predId)){
      if (out.tmr) nd.preds = nd.preds.map(p => p.id === out.predId ? Object.assign({}, p, { text:out.tmr }) : p);
      else { nd.preds = nd.preds.filter(p => p.id !== out.predId); out.predId = null; }
    } else if (out.tmr){
      out.predId = newId();
      nd.preds.push({ id:out.predId, kind:'specific', text:out.tmr, hid:null, at:new Date().toISOString(), src:'eve', result:'', actual:'' });
    }
    writes.push(() => put('days', nk, nd));
  }
  return out;
}
function hypToast(D){
  if (!D || D.op === 'none') return '';
  if (D.op === 'new') return '写完了。新假设进了清单。';
  const h = S.hyps[D.hid]; if (!h) return '写完了。';
  const sup = evCount(h, 'sup'), con = evCount(h, 'con');
  if (D.kind === 'con') return '记了一次反例。去清单里缩小它的条件。';
  if (h.status === 'test' && sup >= 3 && con === 0) return '这条已经支持 ' + sup + ' 次，可以在清单里升为「较可信」。';
  return '写完了。';
}

});

});
function onHash(){
  const r = (location.hash || '#today').slice(1);
  route = ['today','log','capture','hyps','week'].includes(r) ? r : 'today';
  if (form && form.dirty){ drafts[form.type + ':' + form.key] = form.data; saveDrafts(); }
  form = null; ui.hypOpen = null; ui.hypNew = false; ui.copy = null; ui.arcDel = null;
  render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', onHash);
document.addEventListener('change', e => { if (e.target && e.target.id === 'importFile' && e.target.files && e.target.files[0]) importFile(e.target.files[0]); });
const r0 = (location.hash || '#today').slice(1); route = ['today','log','capture','hyps','week'].includes(r0) ? r0 : 'today';
init();
})();

<script>
// Offline support. When a newer version takes over, reload once so it shows up right away
// (wait until the person leaves the text box they are typing in).
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  const reloadNow = () => { if (reloading) return; reloading = true; try { sessionStorage.setItem('zwgcb-updated', '1'); } catch (e) {} location.reload(); };
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return;
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) a.addEventListener('blur', () => setTimeout(reloadNow, 600), { once:true });
    else reloadNow();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { updateViaCache:'none' }).then(r => r.update()).catch(() => {});
  });
}
</script>
